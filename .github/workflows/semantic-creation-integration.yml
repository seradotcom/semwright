name: I CircleCI iteration configuration validation
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate-circle-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Source identity and runner-only Python syntax check
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$CANDIDATE" = cd518748f742025a251b78028613aa1b16919e73
          mkdir -p verification/circleci-config
          python3 -m py_compile scripts/circleci-iteration/run_iteration.py
          if python3 scripts/circleci-iteration/run_iteration.py smoke > verification/circleci-config/host-guard.log 2>&1; then
            echo 'CircleCI-only harness incorrectly accepted an Actions runner' >&2
            exit 1
          fi
          grep -F 'CircleCI iteration only' verification/circleci-config/host-guard.log
      - name: Install digest-pinned official CircleCI CLI on hosted runner
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --output "$RUNNER_TEMP/circle-cli.tar.gz" https://github.com/CircleCI-Public/circleci-cli/releases/download/v1.0.51932/circleci-cli_1.0.51932_linux_amd64.tar.gz
          printf '%s  %s\n' d7be00a2818566dfbea0ffea2aad715d20a3681461fe8cd15961ba7e3f2cd37b "$RUNNER_TEMP/circle-cli.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/circle-cli"
          tar -xzf "$RUNNER_TEMP/circle-cli.tar.gz" -C "$RUNNER_TEMP/circle-cli"
          circle_binary=$(find "$RUNNER_TEMP/circle-cli" -type f -name circleci -perm -111)
          test -n "$circle_binary"
          test "$(printf '%s\n' "$circle_binary" | wc -l)" -eq 1
          printf 'CIRCLE_VALIDATOR=%s\n' "$circle_binary" >> "$GITHUB_ENV"
      - name: Validate with the official CircleCI configuration compiler
        run: |
          set -euo pipefail
          "$CIRCLE_VALIDATOR" version | tee verification/circleci-config/cli-version.txt
          "$CIRCLE_VALIDATOR" config validate .circleci/config.yml --json | tee verification/circleci-config/compiler.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          result = json.loads(Path('verification/circleci-config/compiler.json').read_text())
          assert result['valid'] is True, result
          files = ['.circleci/config.yml', 'scripts/circleci-iteration/run_iteration.py']
          report = {'schema_version': 1, 'source_sha': 'cd518748f742025a251b78028613aa1b16919e73',
                    'suite_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                    'status': 'CONFIGURATION_VALIDATED_CIRCLECI_EXECUTION_NOT_OBSERVED',
                    'files_sha256': {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files},
                    'cli_version': '1.0.51932', 'product_tests_executed': 0,
                    'certification_eligible': False, 'r16_closed': False}
          Path('verification/circleci-config/validation.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: circleci-iteration-configuration-diagnostic
          path: verification/circleci-config
          if-no-files-found: error
          retention-days: 7
