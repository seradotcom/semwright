name: Dependency, coverage and fuzz gates
# Explicit Bash enables pipefail so tee cannot mask a failing producer.
defaults:
  run:
    shell: bash
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      full_cert:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_cert:
        description: "Run complete dependency, coverage and fuzz certification"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 8 * * 1'
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      security_dependencies: ${{ steps.scope.outputs.security_dependencies }}
      security_fuzz: ${{ steps.scope.outputs.security_fuzz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: scope
        env:
          FULL_CERT: ${{ inputs.full_cert }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$FULL_CERT" == "true" || "$EVENT_NAME" == "schedule" ]]; then
            python3 scripts/dev/ci-affected-areas.py --full >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
            python3 scripts/dev/ci-affected-areas.py >> "$GITHUB_OUTPUT"

  dependencies:
    needs: scope
    if: ${{ (inputs.full_cert == true || github.event_name == 'schedule' || needs.scope.outputs.security_dependencies == 'true') && !(vars.SEMWRIGHT_PAUSE_MAIN_CI == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: dependency-tools
      - run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo audit --deny warnings
      - run: cargo deny --locked check
  coverage:
    needs: scope
    if: ${{ (inputs.full_cert == true || github.event_name == 'schedule') && !(vars.SEMWRIGHT_PAUSE_MAIN_CI == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: coverage
      - name: Install Linux media development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev
      - run: cargo install --locked cargo-llvm-cov --version 0.9.1
      - run: cargo llvm-cov --locked --workspace --all-features --lcov --output-path lcov.info
      - run: cargo llvm-cov report --json --output-path coverage.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: workspace-coverage
          path: |
            lcov.info
            coverage.json
          retention-days: 14
  fuzz:
    needs: [scope, coverage]
    if: ${{ always() && !cancelled() && ((inputs.full_cert == true || github.event_name == 'schedule' || needs.scope.outputs.security_fuzz == 'true') && !(vars.SEMWRIGHT_PAUSE_MAIN_CI == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-09-18
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: fuzz
          workspaces: fuzz
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo +1.98.1 install --locked cargo-fuzz --version 0.13.2
      - run: |
          mkdir -p verification/fuzz-ci
          for target in protocol selector recipe workflow_trace plugin path video_domain_model video_domain_edit video_domain_contract video_domain_render audio_domain_model audio_domain_edit audio_wav figma_bridge_envelope figma_snapshot figma_refs figma_tokens figma_motion figma_composition godot_bridge_auth godot_config_json godot_diff godot_catalog godot_substrate_schema skill_frontmatter skill_requirements skill_archive_path; do
            cargo +nightly-2026-09-18 fuzz run "$target" -- -max_total_time=10 -timeout=3 -rss_limit_mb=1024 -max_len=8192 2>&1 | tee "verification/fuzz-ci/$target.log"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: bounded-fuzz-evidence
          path: |
            verification/fuzz-ci
            fuzz/artifacts
          retention-days: 14
