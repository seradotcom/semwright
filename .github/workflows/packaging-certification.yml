name: Packaging certification
defaults:
  run:
    shell: bash
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: packaging-${{ matrix.arch }}
      - name: Install native packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev dpkg-dev
      - name: Build release executables
        run: |
          cargo build --locked --release \
            -p semwright-cli --bin semwright \
            -p semwright-daemon --bin semwrightd \
            -p semwright-mcp --bin semwright-mcp \
            -p semwright-tui --bin semwright-inspect \
            -p semwright-plugin-host --bin semwright-sandbox
      - name: Certify deterministic packages and user install lifecycle
        run: |
          python3 scripts/release/certify-packaging.py \
            --bin-dir target/release \
            --arch "${{ matrix.arch }}" \
            --report "$RUNNER_TEMP/packaging-${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaging-certification-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/packaging-${{ matrix.arch }}.json
          retention-days: 14
