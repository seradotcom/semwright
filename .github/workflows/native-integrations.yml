          cargo test --locked -p semwright-mlt-video-driver real_mlt_video_driver_runs_inside_sandbox -- --ignored --nocapture 2>&1 | tee verification/native-ci/mlt-driver-live.log
          cargo test --locked -p semwright-kicad-driver fake_kicad_ipc_runs_through_real_sandboxed_driver_host -- --ignored --nocapture 2>&1 | tee verification/native-ci/kicad-driver-live.log
