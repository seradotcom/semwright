[package]
name = "semwright-driver-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
test-tools = []

[dependencies]
hex.workspace = true
semwright-platform-api.workspace = true
semwright-platform-services.workspace = true
semwright-types.workspace = true
semwright-protocol.workspace = true
semwright-policy.workspace = true
semwright-backend-api.workspace = true
semwright-driver-sdk = { path = "../driver-sdk", version = "=1.0.0" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[[bin]]
name = "semwright-driver-fixture"
path = "src/bin/fixture.rs"

[[bin]]
name = "semwright-tool-fixture"
path = "src/bin/tool_fixture.rs"

[[bin]]
name = "semwright-adversarial-driver-fixture"
path = "src/bin/adversarial_fixture.rs"
required-features = ["test-tools"]
