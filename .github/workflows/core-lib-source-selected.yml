name: Bounded semwright-core source library regression
# This branch is a source-verification donor. Edits to this CI contract
# must not recompile the same pinned Core source just to turn a wrapper green.
on:
  workflow_dispatch:
  push:
    branches: ['verify/a6-core-lib-6f-20261107']
    paths: ['crates/core/src/**']
permissions:
  contents: read
concurrency:
  group: source-lib-6f-once
  cancel-in-progress: false
jobs:
  core-unit:
    name: All semwright-core library tests (not full workspace or Host)
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.98.1'
      - name: Verify unchanged source and one-commit selector
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'seradotcom/semwright'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_REF" = 'refs/heads/verify/a6-core-lib-6f-20261107'
          test "$(git rev-parse HEAD^^)" = '6f053e257a94b1969fc9e42b675a8b6992500e28'
          test "$(git diff --name-only HEAD^^ HEAD)" = '.github/workflows/core-lib-source-selected.yml'
          {
            printf '%s  %s\n' 'ec7f3946d36a3e9e0a6054173220553bd652904cfa48a17daec66ce2e549a18c' 'Cargo.lock'
            printf '%s  %s\n' '842734f50d99a45e8f4fcbe026d4b52a771cc5d2bdc4c62b499dff162819f03f' 'crates/core/src/provider_mounts_tests.rs'
            printf '%s  %s\n' 'b0d714b7d4271df432f0da76517c8f24acbae500da767213abd5db9f403c8d23' 'crates/core/src/operation_permits.rs'
          } | sha256sum --check --status
          test -z "$(git status --porcelain=v1)"
      - name: Install exact source compiler prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev
          pkg-config --modversion libpipewire-0.3
      - name: Run only the semwright-core library unit roster
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core-lib-source"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/core-lib-source/source-sha.original"
          printf '%s\n' 'semwright-core --lib: 82 catalogued, 55 source unit PASS, 27 ignored physical Native (NOT_RUN); no workspace' > "$RUNNER_TEMP/core-lib-source/scope.original"
          cargo test --locked --package semwright-core --lib -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/core-lib-source/roster.original.log"
          # Cargo catalogs 82, but 27 are real Host9/Bubblewrap #[ignore]
          # physical integration tests. Never report those 27 as unit passes.
          python3 - "$RUNNER_TEMP/core-lib-source/roster.original.log" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          catalog = re.findall(r"^running (\d+) tests$", log, re.MULTILINE)
          scope = re.findall(
              r"^test result: ok\. (\d+) passed; 0 failed; (\d+) ignored; "
              r"0 measured; 0 filtered out; finished in [0-9.]+s$",
              log, re.MULTILINE,
          )
          assert catalog == ["82"], f"Unexpected Core test roster: {catalog!r}"
          assert scope == [("55", "27")], f"Wrong Core scope: {scope!r}"
          assert sum(map(int, scope[0])) == int(catalog[0])
          print("SOURCE_ONLY_CORE_OK: 55 executed PASS, 27 physical NOT_RUN, 0 failed")
          PY
          sha256sum "$RUNNER_TEMP/core-lib-source/roster.original.log" > "$RUNNER_TEMP/core-lib-source/roster.sha256"
      - name: Retain original source group results even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: original-core-lib-6f
          path: ${{ runner.temp }}/core-lib-source/
          retention-days: 5
          if-no-files-found: warn
