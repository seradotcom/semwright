name: Plasma Wayland live
defaults:
  run:
    shell: bash
on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'crates/platform-linux/**'
      - 'crates/platform-linux-sys/**'
      - 'crates/platform-api/**'
      - 'crates/platform-services/**'
      - '.github/workflows/live-plasma.yml'
  pull_request:
    paths:
      - 'crates/platform-linux/**'
      - 'crates/platform-linux-sys/**'
      - 'crates/platform-api/**'
      - 'crates/platform-services/**'
      - '.github/workflows/live-plasma.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plasma-live-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # Immutable KDE neon User amd64 manifest, verified in the upstream registry.
  KDE_NEON_IMAGE: invent-registry.kde.org/neon/docker-images/plasma@sha256:ab8faaef342303c21c40d44e9a94d03efa7cfb25cccf251c896a0cd0a9a65808

jobs:
  plasma-wayland:
    if: ${{ !(vars.SEMWRIGHT_PAUSE_MAIN_CI == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: plasma-wayland-live

      - name: Verify a virtual DRM render node for software Mesa
        run: |
          set -euo pipefail
          mkdir -p verification/live-plasma-ci
          # KWin 6.8 virtual output requires EGL/OpenGL, not QPainter.
          # vgem provides render nodes for Mesa kms_swrast without a real GPU.
          if ! sudo modprobe vgem; then
            echo "::error::Runner kernel cannot load vgem; genuine KWin 6.8 acceptance needs a DRM software render node"
            exit 1
          fi
          shopt -s nullglob
          vgem_node=""
          for node in /dev/dri/renderD*; do
            test -c "$node" || continue
            drm_name="$(basename "$node")"
            sysfs_node="$(readlink -f "/sys/class/drm/$drm_name" || true)"
            driver="$(readlink -f "/sys/class/drm/$drm_name/device/driver" || true)"
            # Current Azure kernels register vgem under /devices/faux/vgem,
            # without a per-node device/driver symlink. Verify either trusted
            # sysfs form, never merely infer from renderD128 numbering.
            if [[ "$driver" == */vgem || "$sysfs_node" == */vgem/drm/"$drm_name" ]]; then
              vgem_node="$node"
              break
            fi
          done
          if [[ -z "$vgem_node" ]]; then
            echo "::error::vgem loaded but no vgem render node was exposed; physical Wayland acceptance cannot run on this runner"
            ls -l /dev/dri /sys/class/drm 2>&1 || true
            exit 1
          fi
          stat -c 'vgem=%n owner=%u group=%g mode=%a' "$vgem_node" \
            | tee verification/live-plasma-ci/vgem-render-node.log
          echo "KWIN_VGEM_RENDER_NODE=$vgem_node" >> "$GITHUB_ENV"

      - name: Build the production KWin backend integration test
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev
          mkdir -p verification/live-plasma-ci
          cargo test --locked -p semwright-platform-linux --test kwin_live             --no-run --message-format=json             > verification/live-plasma-ci/rust-build.jsonl
          test_bin=$(python3 - <<'PY'
          import json
          from pathlib import Path
          rows = Path("verification/live-plasma-ci/rust-build.jsonl").read_text().splitlines()
          matches = []
          for line in rows:
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              target = row.get("target", {})
              if (
                  row.get("reason") == "compiler-artifact"
                  and target.get("name") == "kwin_live"
                  and "test" in target.get("kind", [])
                  and row.get("executable")
              ):
                  matches.append(row["executable"])
          if len(matches) != 1:
              raise SystemExit(f"expected one kwin_live test executable, got {matches!r}")
          print(matches[0])
          PY
          )
          cp "$test_bin" verification/live-plasma-ci/kwin-live-test
          chmod 0755 verification/live-plasma-ci/kwin-live-test
          ldd verification/live-plasma-ci/kwin-live-test             | tee verification/live-plasma-ci/kwin-live-test-ldd.log

      - name: Pull pinned KDE neon Plasma 6 image
        run: |
          docker pull "$KDE_NEON_IMAGE"
          docker image inspect "$KDE_NEON_IMAGE"             --format '{{json .RepoDigests}}'             | tee verification/live-plasma-ci/container-image.log
          grep -q 'sha256:ab8faaef342303c21c40d44e9a94d03efa7cfb25cccf251c896a0cd0a9a65808'             verification/live-plasma-ci/container-image.log

      - name: Real KWin 6 virtual Wayland bridge lifecycle
        run: |
          set -euo pipefail
          test -c "$KWIN_VGEM_RENDER_NODE"
          docker run --rm --init --network none \
            --security-opt seccomp=unconfined --cap-add SYS_NICE \
            --device "$KWIN_VGEM_RENDER_NODE:$KWIN_VGEM_RENDER_NODE" \
            --group-add "$(stat -c '%g' "$KWIN_VGEM_RENDER_NODE")" \
            --user "$(id -u):$(id -g)" \
            --entrypoint /usr/bin/dbus-run-session \
            -e SEMWRIGHT_KWIN_TEST_BIN=/test/kwin-live \
            -e SEMWRIGHT_KWIN_EVIDENCE_DIR=/evidence \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/verification/live-plasma-ci:/evidence" \
            -v "$GITHUB_WORKSPACE/verification/live-plasma-ci/kwin-live-test:/test/kwin-live:ro" \
            "$KDE_NEON_IMAGE" -- /usr/bin/bash /workspace/scripts/dev/kwin-live-ci.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: live-plasma-wayland-evidence
          path: verification/live-plasma-ci
          retention-days: 14
