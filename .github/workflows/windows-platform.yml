name: Platformization and Windows

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'crates/platform-*/**'
      - 'crates/protocol/**'
      - 'crates/daemon/**'
      - 'crates/cli/**'
      - 'crates/mcp/**'
      - 'crates/tui/**'
      - 'crates/driver-host/**'
      - 'crates/plugin-host/**'
      - 'fixtures/windows-uia/**'
      - 'docs/windows/**'
      - 'schemas/commands.json'
      - 'tests/python/test_windows_contracts.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platformization-windows-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  windows-native:
    if: ${{ !(vars.SEMWRIGHT_PAUSE_MAIN_CI == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) }}
    name: windows-${{ matrix.arch }} native noninteractive
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: x64
            runs_on: windows-2025
          - arch: arm64
            runs_on: windows-11-arm
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Architecture evidence
        run: |
          set -euo pipefail
          mkdir -p verification/platform-ci
          {
            echo "RUNNER_ARCH=$RUNNER_ARCH"
            echo "PROCESSOR_ARCHITECTURE=${PROCESSOR_ARCHITECTURE:-unknown}"
            rustc -vV
            cargo -V
          } | tee "verification/platform-ci/windows-${{ matrix.arch }}.log"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Windows portable command contracts
        run: |
          set -euo pipefail
          python -m unittest tests.python.test_windows_contracts
      - name: Interactive harness PowerShell parses
        run: |
          set -euo pipefail
          pwsh -NoProfile -NonInteractive -File ./scripts/windows/validate-interactive-certification.ps1
      - name: Native Windows runtime check
        run: >-
          cargo check --locked
          -p semwright-types
          -p semwright-backend-api
          -p semwright-platform-api
          -p semwright-platform-windows-sys
          -p semwright-platform-windows
          -p semwright-platform-services
          -p semwright-platform-host
          -p semwright-protocol
          -p semwright-core
          -p semwright-driver-host
          -p semwright-plugin-host
          -p semwright-daemon
          -p semwright-cli
          -p semwright-mcp
          -p semwright-tui
          --all-targets
      - name: Native Windows runtime Clippy
        run: >-
          cargo clippy --locked
          -p semwright-types
          -p semwright-backend-api
          -p semwright-platform-api
          -p semwright-platform-common
          -p semwright-platform-windows-sys
          -p semwright-platform-windows
          -p semwright-platform-services
          -p semwright-platform-host
          -p semwright-protocol
          -p semwright-core
          -p semwright-driver-host
          -p semwright-plugin-host
          -p semwright-daemon
          -p semwright-cli
          -p semwright-mcp
          -p semwright-tui
          --all-targets -- -D warnings
      - name: Host runner outbound network preflight
        run: |
          python - <<'PY'
          import json, socket
          results = {}
          for endpoint in ("1.1.1.1:443", "1.0.0.1:443"):
              host, port = endpoint.rsplit(":", 1)
              try:
                  with socket.create_connection((host, int(port)), timeout=1.5):
                      results[endpoint] = "reachable"
              except OSError as error:
                  results[endpoint] = f"{type(error).__name__}:{getattr(error, 'winerror', None) or getattr(error, 'errno', None)}"
          print("SEMWRIGHT_HOST_EGRESS=" + json.dumps(results, sort_keys=True))
          PY
      - name: Native Windows runtime tests
        run: >-
          cargo test --locked
          -p semwright-types
          -p semwright-backend-api
          -p semwright-platform-api
          -p semwright-platform-common
          -p semwright-platform-windows-sys
          -p semwright-platform-windows
          -p semwright-platform-services
          -p semwright-platform-host
          -p semwright-protocol
          -p semwright-core
          -p semwright-driver-host
          -p semwright-plugin-host
          -p semwright-daemon
      - name: Secure Windows Driver workspace grants
        run: cargo test --locked -p semwright-driver-host --test windows_secure_host -- secure_windows_driver_workspace --nocapture
      - name: Secure Windows Driver secret grants
        run: cargo test --locked -p semwright-driver-host --test windows_secure_host -- secure_windows_driver_secret --nocapture
      - name: Secure Windows Driver sealed tools
        run: cargo test --locked -p semwright-driver-host --test windows_secure_host -- secure_windows_driver_sealed_tool --nocapture
      - name: Secure Windows Driver loopback bridge
        run: cargo test --locked -p semwright-driver-host --test windows_secure_host -- secure_windows_driver_loopback --nocapture
      - name: Secure Windows Driver ambient network authority
        run: cargo test --locked -p semwright-driver-host --test windows_secure_host -- secure_windows_driver_network --nocapture
      - name: Secure Windows Plugin Host authority
        run: cargo test --locked -p semwright-plugin-host --features test-tools --test windows_secure_host -- --nocapture
      - name: Secure Windows external MCP authority
        run: cargo test --locked -p semwright-federation --test windows_secure_stdio -- --nocapture
      - name: Native Windows docs
        run: |
          set -euo pipefail
          RUSTDOCFLAGS="-D warnings" cargo doc --locked -p semwright-platform-api -p semwright-platform-windows-sys -p semwright-platform-windows -p semwright-platform-services -p semwright-platform-host -p semwright-protocol --no-deps
      - name: UIA fixture compiles natively
        working-directory: fixtures/windows-uia
        run: cargo check
      - name: Record CI class
        run: |
          set -euo pipefail
          CLASS="verification/platform-ci/windows-${{ matrix.arch }}-class.txt"
          cat >"$CLASS" <<'EOF'
          PASS_WINDOWS_NATIVE_CI can only be claimed after this job is green.
          This hosted runner is not evidence of PASS_WINDOWS_INTERACTIVE.
          EOF
          if [[ -f verification/platform-ci/windows-arm64-uia-hit-test.txt ]]; then
            cat >>"$CLASS" <<'EOF'
          BLOCKED_NONINTERACTIVE_OCCLUSION: the hosted ARM64 runner exposed no fixture-owned
          physical pixel. Native ui.hit_test physical-point fidelity remains unverified here
          and requires interactive Windows evidence; all non-pixel UIA fixture assertions ran.
          EOF
          else
            echo "Native UIA physical-point hit-test fixture executed without hosted occlusion." >>"$CLASS"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-${{ matrix.arch }}-evidence
          path: verification/platform-ci/
          retention-days: 14

  sealed-tool-compat:
    if: ${{ !(vars.SEMWRIGHT_PAUSE_MAIN_CI == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) }}
    name: sealed-tool compat ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: server2022-x64
            runs_on: windows-2022
            toolchain: "1.98.1"
            tool_target: ""
            address_space_bytes: "536870912"
          - name: win11-arm-native-host-x64tool
            runs_on: windows-11-arm
            toolchain: "1.98.1"
            tool_target: "x86_64-pc-windows-msvc"
            # Diagnostic-only probe budget: if Prism still fails with STATUS_NO_MEMORY at 4 GiB,
            # do not expand production authority; investigate LPAC/emulation compatibility instead.
            address_space_bytes: "4294967296"
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install diagnostic Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --force-non-host
      - name: Record compatibility environment
        run: |
          set -euo pipefail
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "PROCESSOR_ARCHITECTURE=${PROCESSOR_ARCHITECTURE:-unknown}"
          rustc +${{ matrix.toolchain }} -vV
      - name: Build emulated sealed tool fixture
        if: matrix.tool_target != ''
        run: |
          set -euo pipefail
          rustup target add --toolchain "${{ matrix.toolchain }}" "${{ matrix.tool_target }}"
          cargo +${{ matrix.toolchain }} build --locked \
            -p semwright-driver-host \
            --bin semwright-tool-fixture \
            --target "${{ matrix.tool_target }}"
          echo "SEMWRIGHT_TEST_TOOL_FIXTURE=$PWD/target/${{ matrix.tool_target }}/debug/semwright-tool-fixture.exe" >> "$GITHUB_ENV"
      - name: Sealed tool nested execution probe
        env:
          SEMWRIGHT_TEST_ADDRESS_SPACE_BYTES: ${{ matrix.address_space_bytes }}
        run: >-
          cargo +${{ matrix.toolchain }} test --locked
          -p semwright-driver-host
          --test windows_secure_host
          -- secure_windows_driver_sealed_tool_is_staged_immutable_and_executable
          --nocapture
