name: Quality gates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install jsonschema PyYAML
      - run: python scripts/verify-source.py
      - run: python -m unittest discover -s tests/python -v
      - run: node --test tests/js/bridge.test.mjs
      - run: |
          gcc -Wall -Wextra -Werror -O2 tests/native/openat2.c -o "$RUNNER_TEMP/semwright-openat2"
          fixture=$(mktemp -d)
          "$RUNNER_TEMP/semwright-openat2" "$fixture"
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Intentionally fail rather than invent a green gate for an unlocked handoff.
      - run: test -f Cargo.lock
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets --all-features
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --doc
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --locked --workspace --release
      - run: scripts/dev/fake-smoke.sh
        env:
          BIN_DIR: target/release
