name: Semwright authenticated CircleCI iteration launcher
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [h-harness, portable]
        default: h-harness
        required: true
      lane:
        type: choice
        options: [smoke, composition, graph-effects, authoring, all, retest-affected]
        default: smoke
        required: true
permissions:
  contents: read
concurrency:
  group: semwright-circleci-launch-${{ inputs.target }}-${{ inputs.lane }}
  cancel-in-progress: false
jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Launch the reviewed immutable CircleCI diagnostic
        env:
          CIRCLE_TOKEN: ${{ secrets.CIRCLE_TOKEN }}
          SW_CIRCLE_TARGET: ${{ inputs.target }}
          SW_CIRCLE_LANE: ${{ inputs.lane }}
        run: python3 scripts/circleci-iteration/launch.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: circleci-authenticated-launch-receipt
          path: verification/circleci-launcher
          if-no-files-found: error
          retention-days: 14
