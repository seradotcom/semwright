name: I main promotion source identity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6491c0d838fa066938a494524d69ed507aa0dbe8
          fetch-depth: 0
          persist-credentials: false
      - name: Verify ancestry, production equivalence and exact certified fixture
        env:
          SUITE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          source='6491c0d838fa066938a494524d69ed507aa0dbe8'
          baseline='cd518748f742025a251b78028613aa1b16919e73'
          def git(*args):return subprocess.check_output(['git',*args])
          assert git('rev-parse','HEAD').decode().strip()==source
          subprocess.run(['git','merge-base','--is-ancestor',baseline,source],check=True)
          subprocess.run(['git','diff','--exit-code'],check=True)
          subprocess.run(['git','diff','--cached','--exit-code'],check=True)
          docs=['docs/composition/AUDIO_AV_CONTRACT.md','docs/composition/INTEGRATION.md','docs/composition/TRACEABILITY.md','docs/semantic-creation/INTEGRATION.md']
          fixture='crates/platform-windows/tests/uia_native_fixture.rs'
          changed=git('diff','--name-only',baseline,source).decode().splitlines()
          assert sorted(changed)==sorted(docs+[fixture]),changed
          original_fixture=git('show',baseline+':'+fixture)
          certified=git('show','27924ecf3bba369e0560c6685693bac3aa1dcdc3:integration-lab/i-windows-arm64-cd51874/uia_native_fixture.rs')
          actual=git('show',source+':'+fixture)
          assert actual==certified and actual!=original_fixture
          owners={'A':'65b773f4dd627b860358342f4d40a1ac532566d1','B':'df2654bed6d2ac57d547846b69d16ea48b4a9ee3','C':'77b34d8abad50f242c4c8494e280fe82d5cbcf55','C14':'28eba9d733d254289255b33a9c14d409fad3e2e2','D':'70bd7857e9700b6f03547a706ff0e6496ffd838e','E':'f492f13a028f781d9ca55631764578f5b327eb1b','F':'eadd5caf9b3f47f24158de530b87ad07e597f25e','G':'a88e80f9de4aa2883b233d009a4b41ecdde08a0b','runtime_201':'733037145c374d28cb7d0e3d51dc76c64f223ad4','dependencies_198':'e7d1149e2920522fb0eaec17783e35ca11d0231b','ci_192':'faaa26ce7d014601a3da0a34ba1ff995ae74fae0','formal_av_204':'1fc61e3be25fcdb88e882e989127945508109510','previous_main':'e3713e90e87f1caa8f7105c065094d5c724d144e'}
          for sha in owners.values():subprocess.run(['git','merge-base','--is-ancestor',sha,source],check=True)
          lock=hashlib.sha256(Path('Cargo.lock').read_bytes()).hexdigest()
          assert lock=='53458999594da110fc8e55ebcbab1b7427157c7aacc30ef3eb8b90707bd2cefe'
          evidence={'schema':1,'status':'PASS_SOURCE_IDENTITY','source_sha':source,'suite_sha':os.environ['SUITE_SHA'],'run_id':int(os.environ['RUN_ID']),'certified_engineering_baseline':baseline,'changed_paths':changed,'all_other_tracked_blobs_unchanged':True,'production_source_unchanged':True,'lockfile_sha256':lock,'fixture_sha256':hashlib.sha256(actual).hexdigest(),'fixture_certificate_run':37085834067,'included_ancestors':owners,'H_deferred_by_user':True,'benchmark_executed':False,'independent_R16_closed':False,'main_merge_performed':False}
          Path('promotion-evidence').mkdir()
          Path('promotion-evidence/SOURCE_IDENTITY.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: main-promotion-source-6491c0d
          path: promotion-evidence
          if-no-files-found: error
          retention-days: 30
