[package]
name = "semwright-ardour-audio-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Curated Ardour semantic session backend for Semwright audio-domain"

[lib]
name = "semwright_ardour_audio"
path = "src/lib.rs"

[[bin]]
name = "semwright-ardour-audio-driver"
path = "src/main.rs"

[features]
default = []
live-tests = []

[dependencies]
hex.workspace = true
async-trait.workspace = true
semwright-audio-domain.workspace = true
semwright-driver-sdk.workspace = true
semwright-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true

[dev-dependencies]
semwright-backend-api.workspace = true
semwright-core.workspace = true
semwright-driver-host.workspace = true
semwright-policy.workspace = true
semwright-registry.workspace = true
semwright-skills.workspace = true
semwright-faust-audio-driver = { path = "../driver-faust-audio", version = "=0.9.0-dev.1" }
tokio-util.workspace = true

[lints]
workspace = true
