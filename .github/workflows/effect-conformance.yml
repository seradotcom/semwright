name: Effect conformance diagnostics
on:
  push:
    branches: [feat/effect-conformance]
    paths:
      - 'crates/effect-conformance/**'
      - 'scripts/effects/**'
      - '.github/workflows/effect-conformance.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
  pull_request:
    paths:
      - 'crates/effect-conformance/**'
      - 'scripts/effects/**'
      - '.github/workflows/effect-conformance.yml'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact immutable integration source SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: effect-conformance-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: never
jobs:
  selection:
    if: github.event_name != 'pull_request' || github.head_ref != 'feat/effect-conformance'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: select
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          suite=json.loads(Path('scripts/effects/lane.json').read_text())['suite']
          assert suite in ('effect-contract','godot','blender','native-all','mutations','portable','release')
          runners=['ubuntu-24.04','windows-2025','macos-15'] if suite in ('portable','release') else ['ubuntu-24.04']
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              print('matrix='+json.dumps({'runner':runners}),file=output)
          PY
  effect-contract:
    needs: selection
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Bind exact integration source
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if test "${{ github.event_name }}" = workflow_dispatch; then test "$GITHUB_SHA" = "$EXPECTED_SHA"; fi
      - name: Validate versioned lane selector
        id: lane
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          suite=json.loads(Path('scripts/effects/lane.json').read_text())['suite']
          assert suite in ('effect-contract','godot','blender','native-all','mutations','portable','release')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              print('suite='+suite,file=output)
          PY
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: effects-v1-${{ runner.os }}-${{ runner.arch }}-rust1.98.1
      - name: Collect formatting diff without altering tested source
        run: |
          mkdir -p verification/effects
          cargo fmt -p semwright-effect-conformance
          git diff -- crates/effect-conformance > verification/effects/format.patch
          if test -s verification/effects/format.patch; then git apply -R verification/effects/format.patch; fi
      - name: Reconstructive source package and reproducibility
        run: |
          python3 scripts/effects/package_source.py --source "$EXPECTED_SHA" --output verification/effects/semwright-effect-conformance-source.zip
          python3 scripts/effects/package_source.py --source "$EXPECTED_SHA" --output "$RUNNER_TEMP/effect-source-repro.zip"
          python3 - <<'PY'
          import os
          from pathlib import Path
          first=Path('verification/effects/semwright-effect-conformance-source.zip').read_bytes()
          second=(Path(os.environ['RUNNER_TEMP'])/'effect-source-repro.zip').read_bytes()
          assert first == second, 'source package is not reproducible'
          PY
      - name: Exact source and executed-test receipts
        run: python3 scripts/effects/run_suite.py effect-contract
      - name: Clippy and rustdoc
        run: |
          cargo clippy --locked -p semwright-effect-conformance --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked -p semwright-effect-conformance --no-deps
      - name: Native isolated driver adapter conformance
        if: runner.os == 'Linux' && contains(fromJSON('["godot","blender","native-all","release"]'), steps.lane.outputs.suite)
        env:
          SELECTED_SUITE: ${{ steps.lane.outputs.suite }}
        run: |
          case "$SELECTED_SUITE" in
            godot|blender|native-all) bash scripts/effects/run_native.sh "$SELECTED_SUITE";;
            release) bash scripts/effects/run_native.sh native-all;;
            *) exit 1;;
          esac
      - name: Targeted guard mutation tests
        if: runner.os == 'Linux' && contains(fromJSON('["mutations","release"]'), steps.lane.outputs.suite)
        run: python3 scripts/effects/mutations.py
      - name: Format and source-integrity gate
        run: |
          test ! -s verification/effects/format.patch
          git diff --exit-code -- crates/effect-conformance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: effect-contract-${{ runner.os }}-${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          path: verification/effects
          retention-days: 7
          if-no-files-found: error
