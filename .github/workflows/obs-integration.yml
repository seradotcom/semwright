name: OBS driver integration
defaults:
  run:
    shell: bash
on:
  push:
    branches: [main]
    paths:
      - "crates/driver-obs/**"
      - "crates/driver-sdk/**"
      - "crates/driver-host/**"
      - "crates/plugin-host/**"
      - "fuzz/**"
      - "scripts/dev/obs-driver-smoke.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/obs-integration.yml"
  pull_request:
    paths:
      - "crates/driver-obs/**"
      - "crates/driver-sdk/**"
      - "crates/driver-host/**"
      - "crates/plugin-host/**"
      - "fuzz/**"
      - "scripts/dev/obs-driver-smoke.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/obs-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: obs-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: obs-conformance
      - name: Install fake-server and sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3-websockets apparmor-profiles apparmor-utils
          mkdir -p verification/obs-ci
          bwrap --version | tee verification/obs-ci/bwrap-version.log
          python3 -c 'import websockets; print(websockets.__version__)' | tee verification/obs-ci/websockets-version.log
      - name: Preflight unprivileged Bubblewrap
        run: |
          current_userns=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          sandbox_setup=kernel-default
          if [ "$current_apparmor" = "1" ]; then
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            if [ -f "$profile" ] && sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict && sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict; then
              sandbox_setup=apparmor-bwrap-profile
            else
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
              sandbox_setup=ephemeral-ci-userns-relaxation
            fi
          fi
          {
            echo "sandbox_setup=$sandbox_setup"
            echo "kernel.unprivileged_userns_clone=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
            echo "kernel.apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          } | tee verification/obs-ci/sandbox-setup.log
      - name: Rust OBS driver suite
        run: |
          cargo test --locked -p semwright-driver-obs --all-targets 2>&1 | tee verification/obs-ci/driver-tests.log
          cargo clippy --locked -p semwright-driver-obs --all-targets -- -D warnings 2>&1 | tee verification/obs-ci/driver-clippy.log
      - name: Real Semwright Driver Host against fake OBS
        run: |
          cargo build --locked -p semwright-plugin-host --bin semwright-sandbox
          SEMWRIGHT_TEST_OBS=1 SEMWRIGHT_TEST_SANDBOX_HELPER="$GITHUB_WORKSPACE/target/debug/semwright-sandbox"             cargo test --locked -p semwright-driver-obs --test host_conformance -- --ignored --nocapture 2>&1 | tee verification/obs-ci/host-conformance.log
      - name: Broker, policy and CLI end-to-end against fake OBS
        run: |
          cargo build --locked             -p semwright-driver-obs --bin semwright-obs-driver             -p semwright-plugin-host --bin semwright-sandbox             -p semwright-cli --bin computerctl             -p semwright-daemon --bin semwrightd
          BIN_DIR=target/debug scripts/dev/obs-driver-smoke.sh 2>&1 | tee verification/obs-ci/broker-smoke.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: obs-conformance-evidence
          path: verification/obs-ci
          retention-days: 14
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-09-18
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: obs-fuzz
          workspaces: fuzz
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo +1.98.1 install --locked cargo-fuzz --version 0.13.2
      - name: Bounded OBS fuzz smoke
        run: |
          set -o pipefail
          mkdir -p verification/obs-fuzz-ci
          for target in obs_message obs_event obs_response obs_reference obs_bounded_json obs_capability_mapping; do
            cargo +nightly-2026-09-18 fuzz run "$target" -- -max_total_time=10 -timeout=3 -rss_limit_mb=1024 -max_len=8192 2>&1 | tee "verification/obs-fuzz-ci/$target.log"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: obs-fuzz-evidence
          path: verification/obs-fuzz-ci
          retention-days: 14

  real-obs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: obs-real
      - name: Install isolated OBS prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y obs-studio xvfb xauth bubblewrap iproute2 util-linux
          mkdir -p verification/obs-real-ci
          obs --version 2>&1 | head -5 | tee verification/obs-real-ci/obs-version.log
          bwrap --version | tee verification/obs-real-ci/bwrap-version.log
      - name: Preflight user namespaces
        run: |
          current_userns=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          # The smoke deliberately uses /usr/bin/unshare to create a private
          # user+network namespace before bubblewrap. The bwrap-specific AppArmor
          # profile used elsewhere does not authorize unshare itself. GitHub-hosted
          # runners are disposable; production Semwright never changes this sysctl.
          current_apparmor=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          namespace_setup=kernel-default
          if [ "$current_apparmor" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            namespace_setup=ephemeral-ci-unshare-relaxation
          fi
          {
            echo "namespace_setup=$namespace_setup"
            echo "kernel.unprivileged_userns_clone=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
            echo "kernel.apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          } | tee verification/obs-real-ci/namespace-setup.log
          unshare --user --map-root-user --net -- true
      - name: Build read-only OBS probe
        run: cargo build --locked -p semwright-driver-obs --bin obs-probe --release
      - name: Real isolated OBS WebSocket smoke
        run: |
          python3 crates/driver-obs/tools/real_obs_smoke.py --probe target/release/obs-probe 2>&1 | tee verification/obs-real-ci/real-obs-smoke.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: real-obs-evidence
          path: verification/obs-real-ci
          retention-days: 14
