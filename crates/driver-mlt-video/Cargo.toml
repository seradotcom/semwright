[package]
name = "semwright-mlt-video-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bounded offline semantic MLT video driver; Semwright stdio v1"

[lib]
name = "semwright_mlt_video"
path = "src/lib.rs"

[[bin]]
name = "semwright-mlt-video-driver"
path = "src/main.rs"

[[bin]]
name = "fake-melt"
path = "src/bin/fake_melt.rs"
required-features = ["test-tools"]

[features]
default = []
test-tools = []

[dependencies]
async-trait.workspace = true
libc.workspace = true
semwright-driver-sdk.workspace = true
semwright-types.workspace = true
semwright-video-domain.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
semwright-backend-api.workspace = true
semwright-driver-host.workspace = true
semwright-policy.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio-util.workspace = true

[lints]
workspace = true
