name: Release artifacts (fail-closed)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release-admission:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Enforce full release readiness
        run: python3 scripts/release/assert-ready.py

  multiplatform-distribution:
    needs: release-admission
    uses: ./.github/workflows/v1-distribution.yml

  publish-release-assets:
    needs: multiplatform-distribution
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recheck release admission at publication boundary
        run: python3 scripts/release/assert-ready.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: semwright-v1-*-${{ github.sha }}
          path: release-assets
      - name: Assemble immutable native assets
        run: |
          set -euo pipefail
          mkdir publish
          find release-assets -type f \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.zip' \) -print0 |
            while IFS= read -r -d '' file; do cp "$file" publish/; done
          manifest=$(find release-assets -type f -name V1_DISTRIBUTION_MANIFEST.json -print -quit)
          test -n "$manifest"
          cp "$manifest" publish/
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path("publish")
          files = sorted(p for p in root.iterdir() if p.is_file() and p.name != "SHA256SUMS")
          if len([p for p in files if p.name.endswith((".tar.gz", ".deb", ".zip"))]) != 8:
              raise SystemExit("publication requires all 8 certified native packages")
          (root / "SHA256SUMS").write_text("".join(
              f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in files
          ))
          PY
      - name: Require pre-existing GitHub Release for this tag
        run: gh release view "$GITHUB_REF_NAME" >/dev/null
      - name: Publish certified assets
        run: gh release upload "$GITHUB_REF_NAME" publish/*
