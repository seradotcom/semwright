name: Semantic adversarial lab (G)
on:
  push:
    branches: [test/semantic-adversarial-lab]
    paths:
      - 'tests/semantic-adversarial-lab/**'
      - '!tests/semantic-adversarial-lab/**/*.md'
      - '!tests/semantic-adversarial-lab/COVERAGE.json'
      - '!tests/semantic-adversarial-lab/reports/**'
      - '.github/workflows/semantic-adversarial-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: semantic-adversarial-lab-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: select
        run: |
          matrix=$(python3 tests/semantic-adversarial-lab/runner.py matrix)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
  boundary:
    needs: selection
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.selection.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Independently checkout immutable target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.target_sha }}
          path: audit-target
          persist-credentials: false
      - name: Verify G-only ownership and source identities
        env:
          TARGET_SHA: ${{ matrix.target_sha }}
        run: |
          python3 tests/semantic-adversarial-lab/ownership.py
          test "$(git -C audit-target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Provision scoped runner namespace support
        run: |
          mkdir -p "$RUNNER_TEMP/g-lab-evidence"
          bash scripts/dev/ci-driver-bwrap-profile.sh "$RUNNER_TEMP/g-lab-evidence/sandbox-setup.log"
      - name: Provision pinned Rust for selected contract lane
        if: matrix.lane != 'selftest'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - name: Provision pinned Godot native runtime
        if: matrix.lane == 'godot-native'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev pkg-config unzip
          GODOT_SHA=$(python3 -c 'import json; print(json.load(open("tests/semantic-adversarial-lab/targets.json"))["pins"]["godot_binary_sha256"])')
          TEMPLATE_ARCHIVE_SHA=$(python3 -c 'import json; print(json.load(open("tests/semantic-adversarial-lab/targets.json"))["pins"]["godot_template_archive_sha256"])')
          mkdir -p "$RUNNER_TEMP/g-native/godot" "$RUNNER_TEMP/g-native/templates"
          curl -fL --retry 4 --retry-delay 2 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/g-native/godot.zip"
          unzip -q "$RUNNER_TEMP/g-native/godot.zip" -d "$RUNNER_TEMP/g-native/godot"
          GODOT="$RUNNER_TEMP/g-native/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "$GODOT_SHA  $GODOT" | sha256sum -c -
          test "$($GODOT --version | cut -d. -f1-4)" = "4.7.2.stable"
          curl -fL --retry 4 --retry-delay 2 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/g-native/templates.tpz"
          echo "$TEMPLATE_ARCHIVE_SHA  $RUNNER_TEMP/g-native/templates.tpz" | sha256sum -c -
          unzip -j -q "$RUNNER_TEMP/g-native/templates.tpz" \
            "templates/linux_release.x86_64" -d "$RUNNER_TEMP/g-native/templates"
          TEMPLATE="$RUNNER_TEMP/g-native/templates/linux_release.x86_64"
          chmod 0755 "$TEMPLATE"
          TEMPLATE_SHA=$(sha256sum "$TEMPLATE" | cut -d' ' -f1)
          {
            echo "G_GODOT_BIN=$GODOT"
            echo "G_GODOT_TEMPLATE=$TEMPLATE"
            echo "G_GODOT_TEMPLATE_SHA256=$TEMPLATE_SHA"
          } >> "$GITHUB_ENV"
      - name: Execute independent exact-SHA boundary
        env:
          LANE: ${{ matrix.lane }}
        run: python3 tests/semantic-adversarial-lab/runner.py "$LANE" --target-checkout audit-target
      - name: Preserve bounded evidence even after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semantic-adversarial-${{ matrix.lane }}-${{ github.sha }}
          path: ${{ runner.temp }}/g-lab-evidence
          retention-days: 7
          if-no-files-found: error
  selected-gate:
    if: ${{ always() && !cancelled() }}
    needs: [selection, boundary]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All selected lanes must execute successfully
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          BOUNDARY_RESULT: ${{ needs.boundary.result }}
        run: test "$SELECTION_RESULT" = success && test "$BOUNDARY_RESULT" = success
