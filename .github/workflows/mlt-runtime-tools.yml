name: MLT runtime tools
on:
  workflow_call:
  pull_request:
    paths:
      - 'crates/driver-mlt-video/**'
      - 'crates/driver-host/**'
      - 'crates/driver-sdk/**'
      - 'crates/platform-api/**'
      - 'crates/platform-linux-sys/**'
      - 'crates/platform-services/**'
      - 'scripts/dev/ci-driver-bwrap-profile.sh'
      - '.github/workflows/mlt-runtime-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: mlt-runtime-tools-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  live-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SEMWRIGHT_TEST_MLT_VIDEO_EVIDENCE_ROOT: ${{ runner.temp }}/semwright-mlt-live-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: mlt-runtime-tools
      - name: Install MLT runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3 melt ffmpeg
          mkdir -p verification/mlt-runtime-tools
          melt -version | head -5 | tee verification/mlt-runtime-tools/mlt-version.log
          ffprobe -version | head -3 | tee verification/mlt-runtime-tools/ffprobe-version.log
      - name: Enforce Driver Host AppArmor chain
        run: |
          bash scripts/dev/ci-driver-bwrap-profile.sh verification/mlt-runtime-tools/sandbox.log
      - name: MLT unit and runner contract
        run: |
          cargo test --locked -p semwright-mlt-video-driver --all-features 2>&1 | tee verification/mlt-runtime-tools/tests.log
          cargo clippy --locked -p semwright-mlt-video-driver --all-targets --all-features -- -D warnings
      - name: Real Host-mediated MLT discovery and live driver
        env:
          SEMWRIGHT_TEST_MLT_VIDEO: '1'
          SEMWRIGHT_TEST_MELT: /usr/bin/melt
          SEMWRIGHT_TEST_FFPROBE: /usr/bin/ffprobe
          SEMWRIGHT_TEST_FFMPEG: /usr/bin/ffmpeg
          SEMWRIGHT_TEST_BWRAP: /usr/bin/bwrap
          SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/target/debug/semwright-sandbox
        run: |
          cargo build --locked -p semwright-plugin-host --bin semwright-sandbox \
            -p semwright-mlt-video-driver --bin semwright-mlt-video-driver \
            -p semwright-mlt-video-driver --bin semwright-mlt-runtime-runner
          # The test requires an external custodian's empty, private destination.
          # It must never create, clear or reuse its own originals directory.
          python3 - <<'PY'
          import hashlib, json, os, pathlib, stat, subprocess
          root = pathlib.Path(os.environ["SEMWRIGHT_TEST_MLT_VIDEO_EVIDENCE_ROOT"])
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          assert root.is_absolute() and root.parent == runner_temp
          assert not root.is_relative_to(workspace)
          assert os.environ["GITHUB_RUN_ATTEMPT"] == "1", "An uncertain live attempt is not replayable"
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["GITHUB_SHA"]
          subprocess.run(["git", "diff", "--exit-code", "HEAD", "--"], check=True)
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          root.mkdir(mode=0o700, exist_ok=False)
          metadata = root.lstat()
          assert stat.S_ISDIR(metadata.st_mode) and stat.S_IMODE(metadata.st_mode) == 0o700
          assert metadata.st_uid == os.geteuid() and root.resolve(strict=True) == root
          assert not list(root.iterdir())
          def observation(path):
              path = pathlib.Path(path).resolve(strict=True)
              value = path.stat()
              assert stat.S_ISREG(value.st_mode)
              with path.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              return {"path": str(path), "bytes": value.st_size, "sha256": digest}
          paths = ["Cargo.lock", "rust-toolchain.toml", ".github/workflows/mlt-runtime-tools.yml",
                   "crates/driver-mlt-video/tests/live.rs", "target/debug/semwright-sandbox",
                   "target/debug/semwright-mlt-video-driver", "target/debug/semwright-mlt-runtime-runner",
                   "/usr/bin/melt", "/usr/bin/ffprobe", "/usr/bin/ffmpeg", "/usr/bin/bwrap"]
          binding = {"schema": "semwright.mlt-live-workflow-binding/1", "source_sha": head,
                     "source_tree": tree, "run_id": os.environ["GITHUB_RUN_ID"], "attempt": 1,
                     "root": str(root), "root_device": metadata.st_dev, "root_inode": metadata.st_ino,
                     "root_uid": metadata.st_uid, "root_mode": stat.S_IMODE(metadata.st_mode),
                     "initially_empty": True, "inputs": [observation(path) for path in paths],
                     "job_timeout_minutes": 25, "deadline_enforcer": "GitHub Actions job",
                     "external_filesystem_budget_attested": False,
                     "descendant_closure_attested": False, "formal_acceptance": False,
                     "native_execution_retried": False}
          with pathlib.Path("verification/mlt-runtime-tools/live-source-binding.json").open("x") as output:
              json.dump(binding, output, indent=2); output.write("\n")
          PY
          MELT_REAL=$(realpath /usr/bin/melt)
          MLT_RUNTIME_ROOT=$(dirname "$(dirname "$MELT_REAL")")
          target/debug/semwright-mlt-runtime-runner \
            discover --runtime-root "$MLT_RUNTIME_ROOT" --melt-sealed "$MELT_REAL" \
            > verification/mlt-runtime-tools/direct-discovery.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("verification/mlt-runtime-tools/direct-discovery.json").read_text())
          assert value["schema"] == 1 and value["operation"] == "discover"
          assert value["version"] and len(value["groups"]) == 6
          PY
          exec {MELT_FD}< "$MELT_REAL"
          nested=(bwrap --die-with-parent --new-session --unshare-all --clearenv --cap-drop ALL
            --proc /proc --dev /dev --tmpfs /tmp
            --dir /home --dir /workspace --dir /plugin --dir /plugin/tools
            --dir /run --dir /run/secrets --dir /etc
            --ro-bind /usr /usr
            --ro-bind target/debug/semwright-mlt-runtime-runner /plugin/bin
            --ro-bind target/debug/semwright-sandbox /plugin/sandbox
            --ro-bind "$MLT_RUNTIME_ROOT" /workspace/mlt-runtime
            --perms 0500 --file "$MELT_FD" /plugin/tools/melt
            --setenv HOME /home --setenv PATH /usr/bin:/bin --setenv LANG C.UTF-8
            --setenv XDG_CACHE_HOME /tmp/cache --setenv XDG_CONFIG_HOME /tmp/config
            --setenv XDG_DATA_HOME /tmp/data --setenv SEMWRIGHT_DRIVER_SANDBOX landlock-bwrap-v1
            --chdir /tmp)
          for root in /lib /lib64; do
            [[ ! -e "$root" ]] || nested+=(--ro-bind "$root" "$root")
          done
          [[ ! -f /etc/ld.so.cache ]] || nested+=(--ro-bind /etc/ld.so.cache /etc/ld.so.cache)
          [[ ! -d /etc/alternatives ]] || nested+=(--ro-bind /etc/alternatives /etc/alternatives)
          nested+=(-- /plugin/sandbox
            --limit-nofile 512 --limit-nproc 256 --limit-cpu 30
            --limit-as 4294967296 --limit-fsize 1073741824
            --exec-root /workspace/mlt-runtime --exec-root /plugin/tools/melt
            -- /plugin/bin discover --runtime-root /workspace/mlt-runtime
            --melt-sealed /plugin/tools/melt)
          set +e
          "${nested[@]}" > verification/mlt-runtime-tools/nested-discovery.json \
            2> verification/mlt-runtime-tools/nested-discovery.stderr
          nested_rc=$?
          set -e
          echo "exit_code=$nested_rc" > verification/mlt-runtime-tools/nested-discovery.exit
          cat verification/mlt-runtime-tools/nested-discovery.json || true
          cat verification/mlt-runtime-tools/nested-discovery.stderr || true
          test "$nested_rc" -eq 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          direct = json.loads(Path("verification/mlt-runtime-tools/direct-discovery.json").read_text())
          nested = json.loads(Path("verification/mlt-runtime-tools/nested-discovery.json").read_text())
          assert nested == direct
          PY

          FFPROBE_REAL=$(realpath /usr/bin/ffprobe)
          PROBE_ROOT=$(mktemp -d "$RUNNER_TEMP/mlt-probe-scratch.XXXXXXXX")
          printf 'SEMWRIGHT_MLT_PROBE_ORIGINALS=%s\n' "$PROBE_ROOT" >> "$GITHUB_ENV"
          mkdir -m 0700 -- "$PROBE_ROOT/job-probe"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=red:s=160x90:d=1 \
            -an -c:v ffv1 -f matroska "$PROBE_ROOT/job-probe/probe.bin"
          chmod 0400 "$PROBE_ROOT/job-probe/probe.bin"
          exec {MELT_FD_PROBE}< "$MELT_REAL"
          exec {FFPROBE_FD}< "$FFPROBE_REAL"
          probe_nested=(bwrap --die-with-parent --new-session --unshare-all --clearenv --cap-drop ALL
            --proc /proc --dev /dev --tmpfs /tmp
            --dir /home --dir /workspace --dir /plugin --dir /plugin/tools
            --dir /run --dir /run/secrets --dir /etc
            --ro-bind /usr /usr
            --ro-bind target/debug/semwright-mlt-runtime-runner /plugin/bin
            --ro-bind target/debug/semwright-sandbox /plugin/sandbox
            --ro-bind "$MLT_RUNTIME_ROOT" /workspace/mlt-runtime
            --bind "$PROBE_ROOT" /workspace/scratch
            --perms 0500 --file "$MELT_FD_PROBE" /plugin/tools/melt
            --perms 0500 --file "$FFPROBE_FD" /plugin/tools/ffprobe
            --setenv HOME /home --setenv PATH /usr/bin:/bin --setenv LANG C.UTF-8
            --setenv XDG_CACHE_HOME /tmp/cache --setenv XDG_CONFIG_HOME /tmp/config
            --setenv XDG_DATA_HOME /tmp/data --setenv SEMWRIGHT_DRIVER_SANDBOX landlock-bwrap-v1
            --chdir /tmp)
          for root in /lib /lib64; do
            [[ ! -e "$root" ]] || probe_nested+=(--ro-bind "$root" "$root")
          done
          [[ ! -f /etc/ld.so.cache ]] || probe_nested+=(--ro-bind /etc/ld.so.cache /etc/ld.so.cache)
          [[ ! -d /etc/alternatives ]] || probe_nested+=(--ro-bind /etc/alternatives /etc/alternatives)
          probe_nested+=(-- /plugin/sandbox
            --limit-nofile 512 --limit-nproc 256 --limit-cpu 30
            --limit-as 4294967296 --limit-fsize 1073741824
            --read-root /workspace/scratch --write-root /workspace/scratch
            --exec-root /workspace/mlt-runtime
            --exec-root /plugin/tools/melt --exec-root /plugin/tools/ffprobe
            -- /plugin/bin probe --runtime-root /workspace/mlt-runtime
            --ffprobe-sealed /plugin/tools/ffprobe
            --scratch-root /workspace/scratch
            --directory job-probe --name probe.bin)
          set +e
          "${probe_nested[@]}" > verification/mlt-runtime-tools/nested-probe.json \
            2> verification/mlt-runtime-tools/nested-probe.stderr
          probe_rc=$?
          set -e
          echo "exit_code=$probe_rc" > verification/mlt-runtime-tools/nested-probe.exit
          cat verification/mlt-runtime-tools/nested-probe.json || true
          cat verification/mlt-runtime-tools/nested-probe.stderr || true
          test "$probe_rc" -eq 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("verification/mlt-runtime-tools/nested-probe.json").read_text())
          assert value["schema"] == 1 and value["operation"] == "probe"
          assert value["media"]["streams"]
          PY

          set +e
          cargo test --locked -p semwright-mlt-video-driver real_mlt_video_driver_runs_inside_sandbox -- --ignored --nocapture \
            2>&1 | tee verification/mlt-runtime-tools/live.log
          live_pipeline=("${PIPESTATUS[@]}")
          set -e
          printf '{"cargo_exit_code":%s,"capture_exit_code":%s,"native_execution_retried":false}\n' \
            "${live_pipeline[0]}" "${live_pipeline[1]}" > verification/mlt-runtime-tools/live-exit.json
          test "${live_pipeline[0]}" -eq 0
          test "${live_pipeline[1]}" -eq 0
      - name: Preserve complete synthetic live originals
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, stat, tarfile
          evidence = pathlib.Path("verification/mlt-runtime-tools")
          evidence.mkdir(parents=True, exist_ok=True)
          sources = {"live": pathlib.Path(os.environ["SEMWRIGHT_TEST_MLT_VIDEO_EVIDENCE_ROOT"])}
          if os.environ.get("SEMWRIGHT_MLT_PROBE_ORIGINALS"):
              sources["probe"] = pathlib.Path(os.environ["SEMWRIGHT_MLT_PROBE_ORIGINALS"])
          rows = []; total = 0; roster = []
          for label, root in sources.items():
              if not root.exists():
                  rows.append({"root": label, "state": "NOT_CREATED"}); continue
              assert root.resolve(strict=True) == root and root.is_dir() and not root.is_symlink()
              paths = [root, *sorted(root.rglob("*"))]
              for path in paths:
                  metadata = path.lstat()
                  assert stat.S_ISDIR(metadata.st_mode) or stat.S_ISREG(metadata.st_mode), "Non-regular original: custody refused"
                  total += metadata.st_size if path.is_file() else 0
                  assert len(roster) < 20000 and total <= 512 * 1024 * 1024, "Original archive budget exceeded; no truncation"
                  member = label + ("/" + path.relative_to(root).as_posix() if path != root else "")
                  row = {"member": member, "device": metadata.st_dev, "inode": metadata.st_ino,
                         "mode": metadata.st_mode, "uid": metadata.st_uid, "gid": metadata.st_gid,
                         "bytes": metadata.st_size, "mtime_ns": metadata.st_mtime_ns}
                  if path.is_file():
                      with path.open("rb") as stream:
                          row["sha256"] = hashlib.file_digest(stream, "sha256").hexdigest()
                  rows.append(row); roster.append((path, member, row))
          manifest = {"schema": "semwright.mlt-live-workflow-custody/1", "source_sha": os.environ["GITHUB_SHA"],
                      "run_id": os.environ["GITHUB_RUN_ID"], "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                      "rows": rows, "regular_file_bytes": total, "native_execution_retried": False,
                      "formal_acceptance": False, "descendant_closure_attested": False,
                      "data_scope": "SDK public-source binaries and synthetic live fixtures; manifest secrets=[]; no credentials collected"}
          with (evidence / "live-originals-manifest.json").open("x") as output:
              json.dump(manifest, output, indent=2); output.write("\n")
          if roster:
              archive = evidence / "live-originals.tar.gz"
              with tarfile.open(archive, "x:gz", dereference=False) as output:
                  for path, member, row in roster:
                      before = path.lstat()
                      assert (before.st_dev, before.st_ino, before.st_mode, before.st_size, before.st_mtime_ns) == \
                          (row["device"], row["inode"], row["mode"], row["bytes"], row["mtime_ns"])
                      output.add(path, arcname=member, recursive=False)
              with tarfile.open(archive, "r:gz") as retained:
                  members = retained.getmembers()
                  assert len(members) == len(roster)
                  for (_, name, row), member in zip(roster, members):
                      assert member.name == name
                      if "sha256" in row:
                          with retained.extractfile(member) as stream:
                              assert hashlib.file_digest(stream, "sha256").hexdigest() == row["sha256"]
              with archive.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              with (evidence / "live-originals-archive.json").open("x") as output:
                  json.dump({"file": archive.name, "bytes": archive.stat().st_size,
                             "sha256": digest, "members_verified": len(roster)}, output, indent=2)
                  output.write("\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mlt-runtime-tools-evidence
          path: verification/mlt-runtime-tools
          retention-days: 14
