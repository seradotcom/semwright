name: Godot semantic authoring diagnostics
on:
  push:
    branches: [feat/godot-semantic-authoring]
permissions:
  contents: read
concurrency:
  group: godot-authoring-${{ github.ref }}
  cancel-in-progress: false
jobs:
  godot-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: godot-authoring-v1
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Typed model and compiler
        run: python3 scripts/godot-authoring/ci.py godot-model
      - name: Diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: godot-model-${{ github.sha }}
          path: godot-authoring-evidence/
          if-no-files-found: warn
          retention-days: 7
