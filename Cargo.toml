[workspace]
resolver = "2"
members = ["crates/*", "adapters/example-plugin"]
exclude = ["fuzz"]

[workspace.package]
version = "0.9.0-dev.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Semwright contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
thiserror = "2"
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "process", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
sha2 = "0.10"
libc = "0.2"
jsonschema = { version = "0.33", default-features = false }
serde_yaml_ng = "0.10"
toml = "0.9"
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", features = ["sink"] }
x11rb = { version = "0.13", features = ["xtest"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
url = "2"
base64 = "0.22"
landlock = "=0.4.7"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
clap_mangen = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rmcp = { version = "=3.4.0", features = ["server", "macros", "schemars", "transport-io"] }
ratatui = "0.29"
crossterm = "0.28"
proptest = "1"
tempfile = "3"
semwright-types = { path = "crates/types" }
semwright-protocol = { path = "crates/protocol" }
semwright-registry = { path = "crates/registry" }
semwright-policy = { path = "crates/policy" }
semwright-recipes = { path = "crates/recipes" }
semwright-plugin-sdk = { path = "crates/plugin-sdk" }
semwright-plugin-host = { path = "crates/plugin-host" }
semwright-backend-api = { path = "crates/backend-api" }
semwright-backends = { path = "crates/backends" }
semwright-adapters = { path = "crates/adapters" }
semwright-core = { path = "crates/core" }
semwright-daemon = { path = "crates/daemon" }
semwright-cli = { path = "crates/cli" }
semwright-mcp = { path = "crates/mcp" }
semwright-tui = { path = "crates/tui" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1
