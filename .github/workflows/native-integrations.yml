name: Native application integration
defaults:
  run:
    shell: bash
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: native-applications
      - name: Install Linux media development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev
      - name: Detect actual browser version
        run: |
          mkdir -p verification/native-ci
          command -v google-chrome
          google-chrome --version | tee verification/native-ci/browser-version.log
          test -x /opt/google/chrome/chrome
          sudo chmod 0755 /opt/google/chrome/chrome
          stat -c '%A %a %U:%G %n' /opt/google/chrome/chrome | tee verification/native-ci/browser-binary.log
      - name: Real Rust adapter, owned profile, loopback fixture
        env:
          SEMWRIGHT_TEST_CHROMIUM: /opt/google/chrome/chrome
        run: |
          cargo test --locked --workspace --all-targets --all-features real_chromium_ -- --ignored --nocapture 2>&1 | tee verification/native-ci/chromium.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: real-chromium-evidence
          path: verification/native-ci
          retention-days: 14

  driver-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: driver-conformance
      - name: Install and preflight sandbox dependency
        run: |
          if ! command -v bwrap >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap libpipewire-0.3-dev
          fi
          current_userns=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          sandbox_setup=kernel-default
          if [ "$current_apparmor" = "1" ]; then
            sudo apt-get update
            sudo apt-get install -y apparmor-profiles apparmor-utils
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            if [ -f "$profile" ] && sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict && sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict; then
              sandbox_setup=apparmor-bwrap-profile
            else
              # GitHub-hosted runners are ephemeral. This fallback changes only the
              # disposable CI host; production Semwright never changes this sysctl.
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
              sandbox_setup=ephemeral-ci-userns-relaxation
            fi
          fi
          {
            bwrap --version
            echo "sandbox_setup=$sandbox_setup"
            echo "kernel.unprivileged_userns_clone=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
            echo "kernel.apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          } | tee /tmp/bwrap-version.log
          bwrap_args=(--die-with-parent --new-session --unshare-all --clearenv --cap-drop ALL --proc /proc --dev /dev --tmpfs /tmp --dir /home --dir /workspace --dir /plugin)
          for runtime in /usr /lib /lib64; do
            if [ -e "$runtime" ]; then
              bwrap_args+=(--ro-bind "$runtime" "$runtime")
            fi
          done
          bwrap_args+=(--dir /etc)
          if [ -e /etc/ld.so.cache ]; then
            bwrap_args+=(--ro-bind /etc/ld.so.cache /etc/ld.so.cache)
          fi
          bwrap "${bwrap_args[@]}" -- /usr/bin/true
      - name: Build driver conformance surface
        run: |
          cargo build --locked -p semwright-driver-host --bin semwright-driver-fixture \
            -p semwright-plugin-host --bin semwright-sandbox \
            -p semwright-cli --bin semwright \
            -p semwright-daemon --bin semwrightd
      - name: Sandboxed persistent driver conformance
        run: |
          mkdir -p verification/native-ci
          BIN_DIR=target/debug scripts/dev/driver-conformance.sh 2>&1 | tee verification/native-ci/driver-conformance.log
          BIN_DIR=target/debug scripts/dev/driver-broker-smoke.sh 2>&1 | tee verification/native-ci/driver-broker-smoke.log
          SEMWRIGHT_TEST_DRIVER_V2=1 \
            SEMWRIGHT_TEST_SANDBOX_HELPER="$PWD/target/debug/semwright-sandbox" \
            cargo test --locked -p semwright-driver-host --test protocol_v2 \
            -- --ignored --nocapture 2>&1 | tee verification/native-ci/driver-protocol-v2.log
          cp /tmp/bwrap-version.log verification/native-ci/
      - name: Adversarial plugin sandbox and handshake attestation
        env:
          SEMWRIGHT_TEST_PLUGIN_SANDBOX: "1"
        run: |
          cargo build --locked -p semwright-plugin-host --features test-tools \
            --bin semwright-sandbox --bin semwright-adversarial-plugin-fixture
          cargo test --locked -p semwright-plugin-host --features test-tools \
            --test adversarial -- --ignored --nocapture 2>&1 | tee verification/native-ci/plugin-adversarial.log
          cargo build --locked -p semwright-driver-host --features test-tools \
            --bin semwright-adversarial-driver-fixture
          SEMWRIGHT_TEST_DRIVER_SANDBOX=1 \
            SEMWRIGHT_TEST_SANDBOX_HELPER="$PWD/target/debug/semwright-sandbox" \
            cargo test --locked -p semwright-driver-host --features test-tools \
            --test adversarial_sandbox -- --ignored --nocapture 2>&1 | tee verification/native-ci/driver-adversarial.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: driver-conformance-evidence
          path: verification/native-ci
          retention-days: 14

  driver-distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: driver-distribution
      - name: Test bounded package and static-index contracts
        run: |
          mkdir -p verification/native-ci
          cargo test --locked -p semwright-driver-registry --all-targets 2>&1 | tee verification/native-ci/driver-registry-tests.log
          cargo clippy --locked -p semwright-driver-registry -p semwright-cli --all-targets -- -D warnings 2>&1 | tee verification/native-ci/driver-registry-clippy.log
      - name: Non-executing package install/update/remove smoke
        run: |
          cargo build --locked -p semwright-cli --bin semwright
          BIN_DIR=target/debug scripts/dev/driver-registry-smoke.sh 2>&1 | tee verification/native-ci/driver-distribution-smoke.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: driver-distribution-evidence
          path: |
            verification/native-ci/driver-registry-*
            verification/native-ci/driver-distribution-smoke.log
          retention-days: 14

  libreoffice-driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: libreoffice-driver
      - name: Install LibreOffice, pyuno and sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap fontconfig libreoffice-writer libreoffice-calc python3-uno unzip libpipewire-0.3-dev
          mkdir -p verification/native-ci
          soffice --version | tee verification/native-ci/libreoffice-version.log
          /usr/bin/python3 -c 'import uno; print("pyuno=ok")' | tee verification/native-ci/pyuno.log
          bwrap --version | tee verification/native-ci/bwrap-version.log
      - name: Preflight unprivileged Bubblewrap
        run: |
          current_userns=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          sandbox_setup=kernel-default
          if [ "$current_apparmor" = "1" ]; then
            sudo apt-get install -y apparmor-profiles apparmor-utils
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            if [ -f "$profile" ] && sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict && sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict; then
              sandbox_setup=apparmor-bwrap-profile
            else
              # GitHub-hosted runners are ephemeral. Production Semwright never
              # changes this sysctl; this fallback exists only to test the real sandbox.
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
              sandbox_setup=ephemeral-ci-userns-relaxation
            fi
          fi
          test -d /etc/libreoffice
          test -d /etc/fonts
          {
            echo "sandbox_setup=$sandbox_setup"
            echo "kernel.unprivileged_userns_clone=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
            echo "kernel.apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          } | tee verification/native-ci/sandbox-setup.log
          bwrap_args=(--die-with-parent --new-session --unshare-all --clearenv --cap-drop ALL --proc /proc --dev /dev --tmpfs /tmp --dir /home --dir /workspace --dir /plugin)
          for runtime in /usr /lib /lib64; do
            if [ -e "$runtime" ]; then
              bwrap_args+=(--ro-bind "$runtime" "$runtime")
            fi
          done
          bwrap_args+=(--dir /etc)
          if [ -e /etc/ld.so.cache ]; then
            bwrap_args+=(--ro-bind /etc/ld.so.cache /etc/ld.so.cache)
          fi
          bwrap_args+=(--ro-bind /etc/libreoffice /etc/libreoffice --ro-bind /etc/fonts /etc/fonts)
          bwrap "${bwrap_args[@]}" -- /usr/bin/true
      - name: Build LibreOffice driver surface
        run: |
          cargo build --locked -p semwright-driver-libreoffice --bin semwright-libreoffice-driver \
            -p semwright-plugin-host --bin semwright-sandbox \
            -p semwright-cli --bin semwright \
            -p semwright-daemon --bin semwrightd
      - name: Real sandboxed DriverProvider against LibreOffice UNO
        run: |
          SEMWRIGHT_TEST_LIBREOFFICE=1 SEMWRIGHT_TEST_SANDBOX_HELPER="$GITHUB_WORKSPACE/target/debug/semwright-sandbox" \
            cargo test --locked -p semwright-driver-libreoffice real_libreoffice_driver_runs_inside_sandbox -- --ignored --nocapture 2>&1 | tee verification/native-ci/libreoffice-driver-live.log
      - name: Broker, policy, CLI and LibreOffice end-to-end
        run: |
          BIN_DIR=target/debug scripts/dev/libreoffice-driver-smoke.sh 2>&1 | tee verification/native-ci/libreoffice-broker-smoke.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: libreoffice-driver-evidence
          path: verification/native-ci
          retention-days: 14


  blender-driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: blender-driver
      - name: Install verified Blender 4.5.14 LTS and sandbox dependencies
        env:
          BLENDER_URL: https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz
          BLENDER_SHA256: 9ba871ff2ecd36526b77432745980b7e6664ecd0c7ca11c48849073dcfe06da3
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap fontconfig xz-utils xvfb xauth libpipewire-0.3-dev
          curl --fail --location --retry 3 --output /tmp/blender.tar.xz "$BLENDER_URL"
          echo "$BLENDER_SHA256  /tmp/blender.tar.xz" | sha256sum --check -
          sudo tar -xJf /tmp/blender.tar.xz -C /usr/local
          sudo ln -sf /usr/local/blender-4.5.14-linux-x64/blender /usr/local/bin/blender
          mkdir -p verification/native-ci
          printf '%s  %s\n' "$BLENDER_SHA256" "$BLENDER_URL" | tee verification/native-ci/blender-download.log
          /usr/local/bin/blender --version | head -5 | tee verification/native-ci/blender-version.log
          test "$(/usr/local/bin/blender --version | head -1)" = "Blender 4.5.14 LTS"
          bwrap --version | tee verification/native-ci/blender-bwrap-version.log
      - name: Preflight unprivileged Bubblewrap
        run: |
          current_userns=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          sandbox_setup=kernel-default
          if [ "$current_apparmor" = "1" ]; then
            sudo apt-get install -y apparmor-profiles apparmor-utils
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            if [ -f "$profile" ] && sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict && sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict; then
              sandbox_setup=apparmor-bwrap-profile
            else
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
              sandbox_setup=ephemeral-ci-userns-relaxation
            fi
          fi
          test -d /etc/fonts
          {
            echo "sandbox_setup=$sandbox_setup"
            echo "kernel.unprivileged_userns_clone=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
            echo "kernel.apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          } | tee verification/native-ci/blender-sandbox-setup.log
          bwrap_args=(--die-with-parent --new-session --unshare-all --clearenv --cap-drop ALL --proc /proc --dev /dev --tmpfs /tmp --dir /home --dir /workspace --dir /plugin)
          for runtime in /usr /lib /lib64; do
            if [ -e "$runtime" ]; then
              bwrap_args+=(--ro-bind "$runtime" "$runtime")
            fi
          done
          bwrap_args+=(--dir /etc)
          if [ -e /etc/ld.so.cache ]; then
            bwrap_args+=(--ro-bind /etc/ld.so.cache /etc/ld.so.cache)
          fi
          bwrap_args+=(--ro-bind /etc/fonts /etc/fonts)
          bwrap "${bwrap_args[@]}" -- /usr/local/bin/blender --version
          bwrap "${bwrap_args[@]}" -- /usr/bin/bash -c 'ulimit -v 4194304; exec /usr/local/bin/blender --background --factory-startup --disable-autoexec --python-expr "import bpy; print(bpy.app.version_string)"' 2>&1 | tee verification/native-ci/blender-background-preflight.log
      - name: Build Blender driver surface
        run: |
          cargo build --locked -p semwright-driver-blender --bin semwright-blender-driver \
            -p semwright-plugin-host --bin semwright-sandbox \
            -p semwright-cli --bin semwright \
            -p semwright-daemon --bin semwrightd
      - name: Landlock driver startup reaches protocol handshake
        run: |
          probe=$(mktemp -d)
          chmod 700 "$probe"
          cleanup() { rm -rf "$probe"; }
          trap cleanup EXIT
          bwrap_args=(--die-with-parent --new-session --unshare-all --clearenv --cap-drop ALL --proc /proc --dev /dev --tmpfs /tmp --dir /home --dir /workspace --dir /plugin)
          for runtime in /usr /lib /lib64; do
            if [ -e "$runtime" ]; then
              bwrap_args+=(--ro-bind "$runtime" "$runtime")
            fi
          done
          bwrap_args+=(--dir /etc)
          if [ -e /etc/ld.so.cache ]; then
            bwrap_args+=(--ro-bind /etc/ld.so.cache /etc/ld.so.cache)
          fi
          bwrap_args+=(
            --ro-bind /etc/fonts /etc/fonts
            --ro-bind "$GITHUB_WORKSPACE/target/debug/semwright-blender-driver" /plugin/bin
            --ro-bind "$GITHUB_WORKSPACE/target/debug/semwright-sandbox" /plugin/sandbox
            --bind "$probe" /workspace/workspace
            --setenv HOME /home
            --setenv PATH /usr/bin:/bin
            --setenv LANG C.UTF-8
            --setenv XDG_CACHE_HOME /tmp/cache
            --setenv XDG_CONFIG_HOME /tmp/config
            --setenv XDG_DATA_HOME /tmp/data
            --chdir /tmp
          )
          set +e
          bwrap "${bwrap_args[@]}" -- /plugin/sandbox \
            --limit-nofile 256 --limit-nproc 64 --limit-cpu 300 \
            --limit-as 4294967296 --limit-fsize 1073741824 \
            --write-root /workspace/workspace -- /plugin/bin \
            </dev/null >/dev/null 2>verification/native-ci/blender-driver-handshake.log
          rc=$?
          set -e
          test "$rc" -ne 0
          if ! grep -q 'UnexpectedEof' verification/native-ci/blender-driver-handshake.log; then
            cat verification/native-ci/blender-driver-handshake.log
            exit 1
          fi
      - name: Real sandboxed DriverProvider against Blender 4.5.14 LTS
        run: |
          SEMWRIGHT_TEST_BLENDER=1 SEMWRIGHT_TEST_SANDBOX_HELPER="$GITHUB_WORKSPACE/target/debug/semwright-sandbox" \
            cargo test --locked -p semwright-driver-blender real_blender_driver_introspects_rna_renders_and_saves_inside_sandbox -- --ignored --nocapture 2>&1 | tee verification/native-ci/blender-driver-live.log
      - name: Broker, policy, CLI and Blender end-to-end
        run: |
          BIN_DIR=target/debug scripts/dev/blender-driver-smoke.sh 2>&1 | tee verification/native-ci/blender-broker-smoke.log
      - name: Interactive add-on through Xvfb, broker and Blender main thread
        run: |
          BIN_DIR=target/debug BLENDER_BIN=/usr/local/bin/blender scripts/dev/blender-addon-live-smoke.sh 2>&1 | tee verification/native-ci/blender-addon-live.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: blender-driver-evidence
          path: verification/native-ci
          retention-days: 14

  figma-driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/driver-figma/plugin/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: figma-driver
      - name: Install sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils libpipewire-0.3-dev
          mkdir -p verification/native-ci
      - name: Preflight unprivileged Bubblewrap
        run: |
          current_userns=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          sandbox_setup=kernel-default
          if [ "$current_apparmor" = "1" ]; then
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            if [ -f "$profile" ] && sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict && sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict; then
              sandbox_setup=apparmor-bwrap-profile
            else
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
              sandbox_setup=ephemeral-ci-userns-relaxation
            fi
          fi
          bwrap --version | tee verification/native-ci/figma-bwrap-version.log
          echo "sandbox_setup=$sandbox_setup" | tee verification/native-ci/figma-sandbox-setup.log
          bwrap_args=(--die-with-parent --new-session --unshare-all --clearenv --cap-drop ALL --proc /proc --dev /dev --tmpfs /tmp --dir /home --dir /workspace --dir /plugin)
          for runtime in /usr /lib /lib64; do
            if [ -e "$runtime" ]; then
              bwrap_args+=(--ro-bind "$runtime" "$runtime")
            fi
          done
          bwrap_args+=(--dir /etc)
          if [ -e /etc/ld.so.cache ]; then
            bwrap_args+=(--ro-bind /etc/ld.so.cache /etc/ld.so.cache)
          fi
          bwrap "${bwrap_args[@]}" -- /usr/bin/true
      - name: Build Figma driver and sandbox surface
        run: |
          cargo build --locked -p semwright-driver-figma --features test-tools --bins \
            -p semwright-plugin-host --bin semwright-sandbox
          python3 crates/driver-figma/tools/catalog_consistency.py | tee verification/native-ci/figma-catalog.log
      - name: Production Driver Protocol to fake Figma E2E
        run: |
          BIN_DIR="$GITHUB_WORKSPACE/target/debug" \
            python3 crates/driver-figma/tools/e2e_driver.py | tee verification/native-ci/figma-e2e.log
      - name: Build and test the Figma Plugin API bridge
        working-directory: crates/driver-figma/plugin
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Sandboxed DriverProvider to fake Figma
        env:
          SEMWRIGHT_TEST_FIGMA: "1"
          SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/target/debug/semwright-sandbox
        run: |
