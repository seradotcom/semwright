version.workspace = true
edition.workspace = true
license.workspace = true
description = "Managed semantic Motion Canvas projects and bounded render jobs"

[[bin]]
name = "semwright-motion-canvas-driver"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
sha2.workspace = true
uuid.workspace = true
regex.workspace = true
base64.workspace = true
tokio.workspace = true
tokio-util.workspace = true
semwright-driver-sdk.workspace = true
semwright-types.workspace = true
jsonschema.workspace = true
png = "0.18.0"
roxmltree = "0.21.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }
libc.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
semwright-backend-api.workspace = true
semwright-driver-host.workspace = true
semwright-platform-api.workspace = true
semwright-platform-services.workspace = true
semwright-policy.workspace = true
semwright-protocol.workspace = true

[lints]
workspace = true
