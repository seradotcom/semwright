name: Independent security review handoff (external record only)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact frozen source SHA reviewed by the independent reviewer
        type: string
        required: true
      distribution_run_id:
        description: Successful same-repository final exact-SHA V1 distribution run
        type: string
        required: true
      review_record:
        description: Original security-review.json supplied by the independent reviewer, never generated by this workflow
        type: string
        required: true
      maintainer_verified_provenance:
        description: Maintainer has verified reviewer authorship, independence, report scope and remediations
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      DISTRIBUTION_RUN_ID: ${{ inputs.distribution_run_id }}
      REVIEW_RECORD: ${{ inputs.review_record }}
      MAINTAINER_VERIFIED_PROVENANCE: ${{ inputs.maintainer_verified_provenance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require an external record and explicit provenance verification
        run: |
          set -euo pipefail
          test "$MAINTAINER_VERIFIED_PROVENANCE" = true
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DISTRIBUTION_RUN_ID" =~ ^[0-9]+$ ]]
          test "$CANDIDATE_SHA" = "$(git rev-parse HEAD)"
          test "$(gh run view "$DISTRIBUTION_RUN_ID" --json headSha --jq .headSha)" = "$CANDIDATE_SHA"
          test "$(gh run view "$DISTRIBUTION_RUN_ID" --json conclusion --jq .conclusion)" = success
          python3 - <<'PY'
          import os
          from pathlib import Path
          record = os.environ['REVIEW_RECORD']
          if not record or len(record.encode('utf-8')) > 131072:
              raise SystemExit('bounded external reviewer record required')
          Path('external-review').mkdir(mode=0o700)
          Path('external-review/security-review.json').write_text(record, encoding='utf-8')
          PY
      - name: Obtain the final exact-SHA distribution manifest
        run: |
          set -euo pipefail
          gh run download "$DISTRIBUTION_RUN_ID" \
            -n "semwright-v1-distribution-manifest-$CANDIDATE_SHA" -D distribution
      - name: Validate external bindings, not reviewer authenticity
        run: |
          set -euo pipefail
          python3 scripts/release/assert-ready.py --mode publish \
            --candidate-sha "$CANDIDATE_SHA" --maintainer-approved \
            --review-report external-review/security-review.json \
            --distribution-manifest distribution/V1_DISTRIBUTION_MANIFEST.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: independent-security-review
          path: external-review/security-review.json
          if-no-files-found: error
          retention-days: 30
