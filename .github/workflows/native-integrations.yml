name: I targeted global native fixture integration
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: i-global-native-fixtures-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  blender-driver:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SEMWRIGHT_TEST_BLENDER_ROOT: /usr/local/blender-4.5.14-linux-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact product source; no fixture overlay
        env:
          SOURCE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = ae62d8bf1d607019e92fe428e505c29e2bf552c9
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          mkdir -p verification/native-ci
          printf '%s\n' "$SOURCE_SHA" > verification/native-ci/product-source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > verification/native-ci/fixture-suite-sha.txt
          git diff --check
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: blender-driver
      - name: Install verified Blender 4.5.14 LTS and sandbox dependencies
        env:
          BLENDER_URL: https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz
          BLENDER_SHA256: 9ba871ff2ecd36526b77432745980b7e6664ecd0c7ca11c48849073dcfe06da3
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap fontconfig xz-utils xvfb xauth libpipewire-0.3-dev
          curl --fail --location --retry 3 --output /tmp/blender.tar.xz "$BLENDER_URL"
          echo "$BLENDER_SHA256  /tmp/blender.tar.xz" | sha256sum --check -
          sudo tar -xJf /tmp/blender.tar.xz -C /usr/local
          rm -f /tmp/blender.tar.xz
          mkdir -p verification/native-ci
          printf '%s  %s\n' "$BLENDER_SHA256" "$BLENDER_URL" | tee verification/native-ci/blender-download.log
          "$SEMWRIGHT_TEST_BLENDER_ROOT/blender" --version | head -5 | tee verification/native-ci/blender-version.log
          test "$("$SEMWRIGHT_TEST_BLENDER_ROOT/blender" --version | head -1)" = "Blender 4.5.14 LTS"
          sha256sum "$SEMWRIGHT_TEST_BLENDER_ROOT/blender" | tee verification/native-ci/blender-executable-sha256.log
          bwrap --version | tee verification/native-ci/blender-bwrap-version.log
      - name: Generate pinned Blender RNA coverage inventory
        run: |
          "$SEMWRIGHT_TEST_BLENDER_ROOT/blender" --background --factory-startup --disable-autoexec \
            --python "$GITHUB_WORKSPACE/crates/driver-blender/tools/rna_coverage.py" -- \
            "$GITHUB_WORKSPACE/verification/native-ci/blender-rna-coverage.json"
          python3 - <<'PY2'
          import json
          from pathlib import Path
          data=json.loads(Path('verification/native-ci/blender-rna-coverage.json').read_text())
          print(json.dumps(data['summary'], sort_keys=True))
          PY2
      - name: Typed GLB adapter contract on real Blender
        run: |
          set -o pipefail
          "$SEMWRIGHT_TEST_BLENDER_ROOT/blender" --background --factory-startup --disable-autoexec \
            --python "$GITHUB_WORKSPACE/crates/driver-blender/tools/export_glb_contract.py" \
            2>&1 | tee verification/native-ci/blender-export-glb-contract.log
      - name: Preflight scoped Driver Host Bubblewrap
        run: |
          bash scripts/dev/ci-driver-bwrap-profile.sh verification/native-ci/blender-sandbox-setup.log
          test -d /etc/fonts
          test -x "$SEMWRIGHT_TEST_BLENDER_ROOT/blender"
          bwrap_args=(--die-with-parent --new-session --unshare-all --clearenv --cap-drop ALL --proc /proc --dev /dev --tmpfs /tmp --dir /home --dir /workspace --dir /plugin --dir /plugin/tools)
          for runtime in /usr /lib /lib64; do
            if [ -e "$runtime" ]; then bwrap_args+=(--ro-bind "$runtime" "$runtime"); fi
          done
          bwrap_args+=(--dir /etc)
          if [ -e /etc/ld.so.cache ]; then bwrap_args+=(--ro-bind /etc/ld.so.cache /etc/ld.so.cache); fi
          bwrap_args+=(
            --ro-bind /etc/fonts /etc/fonts
            --ro-bind "$SEMWRIGHT_TEST_BLENDER_ROOT" /workspace/blender-runtime
            --ro-bind "$SEMWRIGHT_TEST_BLENDER_ROOT/blender" /plugin/tools/blender
            --setenv HOME /home
            --setenv PYTHONNOUSERSITE 1
            --setenv LD_LIBRARY_PATH /workspace/blender-runtime/lib
            --setenv BLENDER_SYSTEM_RESOURCES /workspace/blender-runtime/4.5
            --setenv BLENDER_SYSTEM_SCRIPTS /workspace/blender-runtime/4.5/scripts
            --setenv BLENDER_SYSTEM_EXTENSIONS /workspace/blender-runtime/4.5/extensions
            --setenv BLENDER_SYSTEM_DATAFILES /workspace/blender-runtime/4.5/datafiles
            --setenv BLENDER_SYSTEM_PYTHON /workspace/blender-runtime/4.5/python
            --setenv BLENDER_USER_RESOURCES /tmp/blender-user
          )
          bwrap "${bwrap_args[@]}" -- /plugin/tools/blender --version
          set -o pipefail
          bwrap "${bwrap_args[@]}" -- /plugin/tools/blender --background --factory-startup --disable-autoexec \
            --python-expr "import bpy; print(bpy.app.version_string)" \
            2>&1 | tee verification/native-ci/blender-background-preflight.log
      - name: Build Blender driver surface
        run: |
          cargo build --locked -p semwright-driver-blender \
            --bin semwright-blender-driver --bin semwright-blender-session-runner \
            -p semwright-plugin-host --bin semwright-sandbox \
            -p semwright-cli --bin semwright \
            -p semwright-daemon --bin semwrightd
      - name: Landlock driver startup reaches protocol handshake
        run: |
          probe=$(mktemp -d)
          chmod 700 "$probe"
          cleanup() { rm -rf "$probe"; }
          trap cleanup EXIT
          bwrap_args=(--die-with-parent --new-session --unshare-all --clearenv --cap-drop ALL --proc /proc --dev /dev --tmpfs /tmp --dir /home --dir /workspace --dir /plugin --dir /plugin/tools)
          for runtime in /usr /lib /lib64; do
            if [ -e "$runtime" ]; then
              bwrap_args+=(--ro-bind "$runtime" "$runtime")
            fi
          done
          bwrap_args+=(--dir /etc)
          if [ -e /etc/ld.so.cache ]; then
            bwrap_args+=(--ro-bind /etc/ld.so.cache /etc/ld.so.cache)
          fi
          bwrap_args+=(
            --ro-bind /etc/fonts /etc/fonts
            --ro-bind "$SEMWRIGHT_TEST_BLENDER_ROOT" /workspace/blender-runtime
            --ro-bind "$SEMWRIGHT_TEST_BLENDER_ROOT/blender" /plugin/tools/blender
            --ro-bind "$GITHUB_WORKSPACE/target/debug/semwright-blender-driver" /plugin/bin
            --ro-bind "$GITHUB_WORKSPACE/target/debug/semwright-sandbox" /plugin/sandbox
            --bind "$probe" /workspace/workspace
            --setenv HOME /home
            --setenv PATH /usr/bin:/bin
            --setenv LANG C.UTF-8
            --setenv XDG_CACHE_HOME /tmp/cache
            --setenv XDG_CONFIG_HOME /tmp/config
            --setenv XDG_DATA_HOME /tmp/data
            --chdir /tmp
          )
          set +e
          bwrap "${bwrap_args[@]}" -- /plugin/sandbox \
            --limit-nofile 256 --limit-nproc 64 --limit-cpu 300 \
            --limit-as 4294967296 --limit-fsize 1073741824 \
            --write-root /workspace/workspace \
            --read-root /workspace/blender-runtime \
            --exec-root /plugin/tools/blender -- /plugin/bin \
            </dev/null >/dev/null 2>verification/native-ci/blender-driver-handshake.log
          rc=$?
          set -e
          test "$rc" -ne 0
          if ! grep -q 'UnexpectedEof' verification/native-ci/blender-driver-handshake.log; then
            cat verification/native-ci/blender-driver-handshake.log
            exit 1
          fi
      - name: Real sandboxed DriverProvider against Blender 4.5.14 LTS
        run: |
          set -o pipefail
          SEMWRIGHT_TEST_BLENDER=1 SEMWRIGHT_TEST_SANDBOX_HELPER="$GITHUB_WORKSPACE/target/debug/semwright-sandbox" \
            cargo test --locked -p semwright-driver-blender real_blender_driver_introspects_rna_renders_and_saves_inside_sandbox -- --ignored --nocapture 2>&1 | tee verification/native-ci/blender-driver-live.log
      - name: Broker, policy, CLI and Blender end-to-end
        run: |
          set -o pipefail
          BIN_DIR=target/debug scripts/dev/blender-driver-smoke.sh 2>&1 | tee verification/native-ci/blender-broker-smoke.log
      - name: Interactive add-on through Xvfb, broker and Blender main thread
        run: |
          set -o pipefail
          BIN_DIR=target/debug BLENDER_BIN="$SEMWRIGHT_TEST_BLENDER_ROOT/blender" scripts/dev/blender-addon-live-smoke.sh 2>&1 | tee verification/native-ci/blender-addon-live.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: blender-driver-evidence
          path: verification/native-ci
          retention-days: 14

  kicad-mlt-drivers:
    needs: blender-driver
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact product source; no fixture overlay
        env:
          SOURCE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = ae62d8bf1d607019e92fe428e505c29e2bf552c9
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          mkdir -p verification/native-ci
          printf '%s\n' "$SOURCE_SHA" > verification/native-ci/product-source-sha.txt
          printf '%s\n' "$GITHUB_SHA" > verification/native-ci/fixture-suite-sha.txt
          git diff --check
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23.x"
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: kicad-mlt-drivers
      - name: Install native driver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3 melt ffmpeg libpipewire-0.3-dev
          mkdir -p verification/native-ci
          melt -version | head -5 | tee verification/native-ci/mlt-version.log
          ffprobe -version | head -3 | tee verification/native-ci/ffprobe-version.log
          go version | tee verification/native-ci/go-version.log
          bwrap --version | tee verification/native-ci/bwrap-version.log
      - name: Preflight unprivileged Bubblewrap
        run: |
          bash scripts/dev/ci-driver-bwrap-profile.sh verification/native-ci/extended-driver-sandbox.log
      - name: Build and test MLT semantic driver
        run: |
          cargo test --locked -p semwright-mlt-video-driver --all-features 2>&1 | tee verification/native-ci/mlt-tests.log
          cargo clippy --locked -p semwright-mlt-video-driver --all-targets --all-features -- -D warnings
      - name: Build and test GPL KiCad IPC integration
        env:
          GOCACHE: ${{ runner.temp }}/kicad-go-cache
          GOTMPDIR: ${{ runner.temp }}
        run: |
          (cd integrations/kicad-driver/native && go test ./...) 2>&1 | tee verification/native-ci/kicad-go-tests.log
          cargo test --locked -p kicad-ipc -p semwright-kicad-driver 2>&1 | tee verification/native-ci/kicad-rust-tests.log
          cargo clippy --locked -p kicad-ipc -p semwright-kicad-driver --all-targets -- -D warnings
      - name: Real DriverProvider sandbox conformance
        env:
          SEMWRIGHT_TEST_MLT_VIDEO: 1
          SEMWRIGHT_TEST_MELT: /usr/bin/melt
          SEMWRIGHT_TEST_FFPROBE: /usr/bin/ffprobe
          SEMWRIGHT_TEST_FFMPEG: /usr/bin/ffmpeg
          SEMWRIGHT_TEST_BWRAP: /usr/bin/bwrap
          SEMWRIGHT_TEST_KICAD: 1
          SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/target/debug/semwright-sandbox
          GOCACHE: ${{ runner.temp }}/kicad-go-cache
          GOTMPDIR: ${{ runner.temp }}
        run: |
          cargo build --locked -p semwright-plugin-host --bin semwright-sandbox \
            -p semwright-mlt-video-driver --bin semwright-mlt-video-driver \
            -p semwright-kicad-driver --bin semwright-kicad-driver
          cargo test --locked -p semwright-mlt-video-driver real_mlt_video_driver_runs_inside_sandbox -- --ignored --nocapture 2>&1 | tee verification/native-ci/mlt-driver-live.log
          cargo test --locked -p semwright-kicad-driver fake_kicad_ipc_runs_through_real_sandboxed_driver_host -- --ignored --nocapture 2>&1 | tee verification/native-ci/kicad-driver-live.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: kicad-mlt-driver-evidence
          path: verification/native-ci
          retention-days: 14

