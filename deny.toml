[advisories]
# Reviewed 2026-10-31. These are unmaintained notices, NOT known
# vulnerabilities. Keep these exceptions synchronized with the security CI
# and docs/SECURITY_ADVISORY_EXCEPTIONS.md.
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is transitive via serde_yaml_ng; no vetted parser migration within Rust 1.88 yet (2026-10-31)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is transitive via zbus 5; migration to zbus 6 requires Rust >=1.89 (2026-10-31)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is transitive via zbus 5; migration to zbus 6 requires Rust >=1.89 (2026-10-31)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is transitive via zbus 5; migration to zbus 6 requires Rust >=1.89 (2026-10-31)" },
]
[licenses]
allow = ["MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "BSL-1.0", "CC0-1.0", "MPL-2.0"]
confidence-threshold = 0.93
[[licenses.exceptions]]
allow = ["GPL-3.0-or-later"]
name = "kicad-ipc"
[[licenses.exceptions]]
allow = ["GPL-3.0-or-later"]
name = "semwright-kicad-driver"

[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
name = "webpki-roots"
[bans]
multiple-versions = "warn"
wildcards = "deny"
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
