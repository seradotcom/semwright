name: H immutable native preparation repackage
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      H_PACKAGE_SOURCE_SHA: e6908f0bf05849543ed76b8aa870231097a7de38
      H_PACKAGE_NATIVE_RUN_ID: '37094481790'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify all immutable native jobs passed and preserve original run disposition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/seradotcom/semwright/actions/runs/$H_PACKAGE_NATIVE_RUN_ID > "$RUNNER_TEMP/native-run.json"
          gh api repos/seradotcom/semwright/actions/runs/$H_PACKAGE_NATIVE_RUN_ID/jobs > "$RUNNER_TEMP/native-jobs.json"
          python3 - <<'PYPROOF'
          import json,os
          from pathlib import Path
          run=json.loads((Path(os.environ['RUNNER_TEMP'])/'native-run.json').read_text())
          jobs=json.loads((Path(os.environ['RUNNER_TEMP'])/'native-jobs.json').read_text())['jobs']
          assert run['head_sha']==os.environ['H_PACKAGE_SOURCE_SHA'] and run['status']=='completed'
          for name in ('harness','native (blender)','native (godot)','native (cross_app)'):
              selected=[j for j in jobs if j['name']==name]
              assert len(selected)==1 and selected[0]['conclusion']=='success',name
          print('Native source and four required successful jobs verified; original global conclusion:',run['conclusion'])
          PYPROOF
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e6908f0bf05849543ed76b8aa870231097a7de38
          path: laboratory
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          github-token: ${{ github.token }}
          repository: seradotcom/semwright
          run-id: 37094481790
          name: H-harness-foundation
          path: laboratory/verification/H
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          github-token: ${{ github.token }}
          repository: seradotcom/semwright
          run-id: 37094481790
          name: H-native-blender-controls
          path: laboratory/verification/H/native-blender
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          github-token: ${{ github.token }}
          repository: seradotcom/semwright
          run-id: 37094481790
          name: H-native-godot-controls
          path: laboratory/verification/H/native-godot
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          github-token: ${{ github.token }}
          repository: seradotcom/semwright
          run-id: 37094481790
          name: H-native-cross_app-controls
          path: laboratory/verification/H/native-cross_app
      - name: Package original native source and receipts without engine reruns
        env:
          H_PACKAGE_SOURCE_ROOT: ${{ github.workspace }}/laboratory
        run: python3 scripts/h-preparation-repackage/package.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: H-preparatory-laboratory-delivery-repacked
          path: ${{ runner.temp }}/H-preparation
          if-no-files-found: error
          retention-days: 14
