name: Maintainer secret precheck
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/repository-secret-scan.yml'
      - 'scripts/ci/repository-secret-scan.py'
      - 'scripts/ci/repository-secret-triage.json'
      - 'tests/python/test_repository_secret_scan.py'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: repository-secret-scan-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  history-and-tree:
    if: ${{ !(vars.SEMWRIGHT_PAUSE_MAIN_CI == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanner in disposable runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repository-gitleaks"
          curl -fsSL --retry 2 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/repository-gitleaks/tool.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' \
            "$RUNNER_TEMP/repository-gitleaks/tool.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/repository-gitleaks/tool.tar.gz" \
            -C "$RUNNER_TEMP/repository-gitleaks" gitleaks
      - name: Scan immutable tree and complete HEAD history
        run: |
          python3 scripts/ci/repository-secret-scan.py \
            --binary "$RUNNER_TEMP/repository-gitleaks/gitleaks" \
            --output "$RUNNER_TEMP/repository-secret-evidence"
      - name: Retain metadata-only secret-scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repository-secret-scan-${{ github.sha }}
          path: ${{ runner.temp }}/repository-secret-evidence/summary.json
          if-no-files-found: error
          retention-days: 14
