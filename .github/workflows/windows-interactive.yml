name: Windows interactive certification

on:
  workflow_dispatch:
    inputs:
      confirm_disposable_desktop:
        description: "Confirm an unlocked disposable desktop; focus and clipboard will change"
        required: true
        default: false
        type: boolean
      capture_mode:
        description: "WGC picker action to certify"
        required: true
        default: "Skip"
        type: choice
        options:
          - Skip
          - Select
          - Cancel
          - Both

permissions:
  contents: read

concurrency:
  group: windows-interactive-certification
  cancel-in-progress: false

jobs:
  certify:
    name: unlocked Windows desktop
    runs-on: [self-hosted, Windows]
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults:
      run:
        shell: bash
    steps:
      - name: Require explicit disposable desktop admission
        if: inputs.confirm_disposable_desktop != true
        run: |
          echo "A disposable desktop must be explicitly confirmed before any interactive test." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Verify interactive runner identity
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "self-hosted"
          command -v pwsh >/dev/null
          printf 'runner_arch=%s session=%s sha=%s\n' "$RUNNER_ARCH" "${SESSIONNAME:-unknown}" "${{ github.sha }}"
      - name: Run interactive certification harness
        run: |
          set -euo pipefail
          pwsh -NoProfile -File ./scripts/windows/run-interactive-certification.ps1 \
            -ConfirmDisposableDesktop -CaptureMode "${{ inputs.capture_mode }}" \
            -EvidenceRoot "$PWD/verification/windows-interactive/evidence"
      - name: Upload interactive evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-interactive-${{ runner.arch }}-${{ github.sha }}
          path: verification/windows-interactive/
          if-no-files-found: error
          retention-days: 30
