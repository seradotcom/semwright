name: Maintainer secret precheck
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/pre-r16.yml'
      - 'scripts/ci/pre-r16-secret-scan.py'
      - 'scripts/ci/pre-r16-secret-triage.json'
      - 'tests/python/test_pre_r16_secret_scan.py'
      - 'verification/pre-r16/**'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable source for the independent review packet
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: pre-r16-secrets-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  history-and-tree:
    if: ${{ !(vars.SEMWRIGHT_PAUSE_MAIN_CI == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanner in disposable runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pre-r16-gitleaks"
          curl -fsSL --retry 2 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/pre-r16-gitleaks/tool.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' \
            "$RUNNER_TEMP/pre-r16-gitleaks/tool.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pre-r16-gitleaks/tool.tar.gz" \
            -C "$RUNNER_TEMP/pre-r16-gitleaks" gitleaks
      - name: Scan immutable tree and complete HEAD history
        run: |
          python3 scripts/ci/pre-r16-secret-scan.py \
            --binary "$RUNNER_TEMP/pre-r16-gitleaks/gitleaks" \
            --output "$RUNNER_TEMP/pre-r16-secret-evidence"
      - name: Retain metadata-only precheck evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pre-r16-secret-precheck-${{ github.sha }}
          path: ${{ runner.temp }}/pre-r16-secret-evidence/summary.json
          if-no-files-found: error
          retention-days: 14

  review-packet:
    needs: history-and-tree
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Generate immutable unreviewed packet on the hosted runner
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          bash scripts/dev/security-review-bundle.sh "$SOURCE_SHA" "$RUNNER_TEMP/independent-review-packet"
          cd "$RUNNER_TEMP/independent-review-packet"
          sha256sum -c SHA256SUMS
          python3 - <<'PYVERIFY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text())
          assert manifest['baseline_sha'] == os.environ['SOURCE_SHA']
          assert manifest['status'] == 'UNREVIEWED'
          assert manifest['independent_review_required'] is True
          assert manifest['self_attestation'] is False
          PYVERIFY
      - name: Retain full source and reviewer template without claiming review completion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: independent-review-packet-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/independent-review-packet
          if-no-files-found: error
          retention-days: 90
