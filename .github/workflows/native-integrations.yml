          SEMWRIGHT_TEST_QT_FIXTURE="$RUNNER_TEMP/atspi-qt-fixture" \
            dbus-run-session -- bash -lc '
              set -euo pipefail
              gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus \
