[package]
name = "semwright-plugin-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Semwright plugin-host: semantic Linux automation"
publish = false

[features]
default = []
test-tools = []

[lints]
workspace = true

[dependencies]
semwright-platform-api.workspace = true
semwright-platform-services.workspace = true
semwright-policy.workspace = true
semwright-types.workspace = true
semwright-protocol.workspace = true
semwright-plugin-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
sha2.workspace = true
libc.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[[bin]]
name = "semwright-sandbox"
path = "src/semwright-sandbox.rs"

[[bin]]
name = "semwright-adversarial-plugin-fixture"
path = "src/bin/adversarial_plugin_fixture.rs"
required-features = ["test-tools"]
