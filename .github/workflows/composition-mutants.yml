name: Composition mutation testing

on:
  push:
    branches: [feat/composition-media]
    paths:
      - 'crates/semantic-composition/**'
      - 'crates/media-time/**'
      - 'crates/motion-authoring/**'
      - 'crates/av-composition/**'
      - '.github/workflows/composition-mutants.yml'
  pull_request:
    paths:
      - 'crates/semantic-composition/**'
      - 'crates/media-time/**'
      - 'crates/motion-authoring/**'
      - 'crates/av-composition/**'
      - '.github/workflows/composition-mutants.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: composition-mutants-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  mutants:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: kernel
            package: semwright-semantic-composition
            files: 'crates/semantic-composition/src/controller.rs crates/semantic-composition/src/vault.rs'
            critical: 'Controller::applying;Controller::executed;Controller::observed;Controller::bind_repair;PlanVault::matches;PlanVault::begin;PlanVault::finish;PlanVault::record_observation;PlanVault::revoke'
          - id: media-time
            package: semwright-media-time
            files: 'crates/media-time/src/lib.rs crates/media-time/src/cue.rs'
            critical: 'Rational::wide;Rational::validate;Rational::checked_add;Rational::checked_sub;Rational::checked_mul;Rational::checked_div;Rational::round;Rate::validate;Rate::quantize;CueGraph::resolve;TimeMap::validate'
          - id: motion
            package: semwright-motion-authoring
            files: 'crates/motion-authoring/src/temporal.rs crates/motion-authoring/src/measurement.rs'
            critical: 'TemporalGraph::solve;Known<T>::value;Bounds::validate;FrameObservation::validate;combine;rule_subject;rectangle;axis_aligned;measure'
          - id: av
            package: semwright-av-composition
            files: 'crates/av-composition/src/sync.rs crates/av-composition/src/coordinator.rs crates/av-composition/src/executor.rs'
            critical: 'AvCoordinator::budget;AvCoordinator::reserve;AvCoordinator::before_dispatch;AvCoordinator::complete;AvCoordinator::validate_state_delta;AvCoordinator::accept_result;AvCoordinator::ready;AvCoordinator::cancel_before_dispatch;AvCoordinator::lost_receipt;classify_reuse;SyncSpec::validate;verify_sync;broker_error'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: composition-mutants-${{ matrix.id }}-v1
      - name: Install pinned cargo-mutants
        run: cargo install --locked cargo-mutants --version 27.1.0
      - name: Validate non-empty mutation selection
        env:
          PACKAGE: ${{ matrix.package }}
          FILES: ${{ matrix.files }}
          ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          mkdir -p "verification/composition-mutants/$ID"
          args=()
          for file in $FILES; do args+=(--file "$file"); done
          cargo mutants --no-config --package "$PACKAGE" "${args[@]}" --list --json \
            > "verification/composition-mutants/$ID/mutants.json"
          python3 - "$ID" <<'PY'
          import json, sys
          from pathlib import Path
          path=Path('verification/composition-mutants')/sys.argv[1]/'mutants.json'
          data=json.loads(path.read_text())
          count=len(data) if isinstance(data,list) else len(data.get('mutants',[]))
          if count < 1:
              raise SystemExit('mutation selector produced zero mutants')
          print(f'selected_mutants={count}')
          PY
      - name: Run selected mutation survey
        env:
          PACKAGE: ${{ matrix.package }}
          FILES: ${{ matrix.files }}
          ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          args=()
          for file in $FILES; do args+=(--file "$file"); done
          set +e
          cargo mutants --no-config --package "$PACKAGE" "${args[@]}" \
            --output "verification/composition-mutants/$ID/out" \
            --timeout 90 --jobs 2 --colors=never --no-times
          rc=$?
          set -e
          echo "$rc" > "verification/composition-mutants/$ID/survey-exit-code.txt"
          test -f "verification/composition-mutants/$ID/out/mutants.out/outcomes.json"
      - name: Summarize broad survey and enforce critical invariants
        env:
          ID: ${{ matrix.id }}
          CRITICAL: ${{ matrix.critical }}
        run: |
          python3 - "$ID" "$CRITICAL" <<'PYCODE'
          import collections, json, os, sys
          from pathlib import Path

          target, critical_raw = sys.argv[1:3]
          critical=set(filter(None,critical_raw.split(';')))
          root=Path('verification/composition-mutants')/target
          outcomes_path=root/'out/mutants.out/outcomes.json'
          if not outcomes_path.is_file():
              raise SystemExit('mutation outcomes are absent')
          data=json.loads(outcomes_path.read_text())
          rows=data.get('outcomes',[])
          if not isinstance(rows,list) or not rows:
              raise SystemExit('mutation outcomes contain no scenarios')

          counts=collections.Counter(row.get('summary','unknown') for row in rows)
          critical_rows=[]
          critical_failures=[]
          broad_survivors=[]
          for row in rows:
              scenario=row.get('scenario')
              if not isinstance(scenario,dict) or 'Mutant' not in scenario:
                  continue
              mutant=scenario['Mutant']
              function=(mutant.get('function') or {}).get('function_name','')
              summary=row.get('summary')
              record={
                  'function':function,
                  'summary':summary,
                  'name':mutant.get('name',''),
                  'file':mutant.get('file',''),
              }
              if function in critical:
                  critical_rows.append(record)
                  if summary in {'MissedMutant','Timeout'}:
                      critical_failures.append(record)
              elif summary in {'MissedMutant','Timeout'}:
                  broad_survivors.append(record)

          observed_functions={row['function'] for row in critical_rows}
          missing_functions=sorted(critical-observed_functions)
          if missing_functions:
              raise SystemExit(f'critical mutation selectors produced no mutants for: {missing_functions}')
          if not critical_rows:
              raise SystemExit('critical mutation gate selected zero mutants')

          survey_rc=int((root/'survey-exit-code.txt').read_text().strip())
          summary={
              'schema_version':1,
              'tested_sha':os.environ['GITHUB_SHA'],
              'run_id':os.environ['GITHUB_RUN_ID'],
              'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'target':target,
              'claim_scope':'broad selected-file survey plus blocking critical-function gate',
              'survey_exit_code':survey_rc,
              'totals':dict(counts),
              'critical_functions':sorted(critical),
              'critical_mutants':len(critical_rows),
              'critical_failures':critical_failures,
              'broad_noncritical_survivors':broad_survivors,
          }
          (root/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          for survivor in broad_survivors[:100]:
              print(f"::warning::{target} noncritical mutation survivor: {survivor['name']}")
          if critical_failures:
              for failure in critical_failures:
                  print(f"::error::{target} critical mutation survivor: {failure['name']}")
              raise SystemExit(
                  f'{target}: {len(critical_failures)} critical mutation survivors/timeouts'
              )
          print(
              f'{target}: critical_mutants={len(critical_rows)} '
              f'broad_survivors={len(broad_survivors)}'
          )
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: composition-mutants-${{ matrix.id }}-${{ github.sha }}
          path: verification/composition-mutants/${{ matrix.id }}
          retention-days: 7
          if-no-files-found: error
