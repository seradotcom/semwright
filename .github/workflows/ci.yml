name: Quality gates
# Explicit Bash enables pipefail so tee cannot mask a failing producer.
defaults:
  run:
    shell: bash
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      full_cert:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_cert:
        description: "Run complete Rust certification gates"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      core_rust: ${{ steps.scope.outputs.core_rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: scope
        name: Classify affected CI area
        env:
          FULL_CERT: ${{ inputs.full_cert }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$FULL_CERT" == "true" ]]; then
            python3 scripts/dev/ci-affected-areas.py --full >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
            python3 scripts/dev/ci-affected-areas.py >> "$GITHUB_OUTPUT"

  source-contracts:
    needs: scope
    if: ${{ !(vars.SEMWRIGHT_PAUSE_MAIN_CI == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: python scripts/verify-oss-hygiene.py
      - run: python -m pip install jsonschema PyYAML
      - run: python scripts/verify-source.py
      - run: python -m unittest discover -s tests/python -v
      - run: node --test tests/js/bridge.test.mjs integrations/motion-canvas/runtime/tests/*.test.mjs
      - run: |
          gcc -Wall -Wextra -Werror -O2 tests/native/openat2.c -o "$RUNNER_TEMP/semwright-openat2"
          fixture=$(mktemp -d)
          "$RUNNER_TEMP/semwright-openat2" "$fixture"
  static-lints:
    needs: scope
    if: ${{ !(vars.SEMWRIGHT_PAUSE_MAIN_CI == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install pinned static lint tools
        run: |
          python -m pip install "ruff==0.13.2"
          sudo apt-get update
          sudo apt-get install -y shellcheck
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -fsSLo "$RUNNER_TEMP/actionlint/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' \
            "$RUNNER_TEMP/actionlint/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Ruff semantic Python lint
        run: ruff check . --select F,E9
      - name: ShellCheck repository scripts
        run: find scripts platforms packaging/portable -type f -name '*.sh' -print0 | sort -z | xargs -0 shellcheck
      - name: actionlint workflows and embedded shell
        run: actionlint

  msrv:
    needs: scope
    if: ${{ (inputs.full_cert == true || needs.scope.outputs.core_rust == 'true') && !(vars.SEMWRIGHT_PAUSE_MAIN_CI == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: msrv-1.88
      - name: Install Linux media development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev
      - run: test -f Cargo.lock
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets --all-features
      - run: cargo build --locked --workspace --all-targets --all-features
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-features --doc
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --locked --workspace --all-features --release
      - run: scripts/dev/fake-smoke.sh
        env:
          BIN_DIR: target/release
      - name: Prepare external MCP sandbox on disposable CI runner
        run: scripts/dev/ci-bwrap-preflight.sh
      - run: scripts/dev/federation-smoke.sh
        env:
          BIN_DIR: target/release

  rust:
    needs: scope
    if: ${{ (inputs.full_cert == true || needs.scope.outputs.core_rust == 'true') && !(vars.SEMWRIGHT_PAUSE_MAIN_CI == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Linux media development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev
      # A genuine locked dependency graph is mandatory.
      - run: test -f Cargo.lock
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets --all-features
      - run: cargo build --locked --workspace --all-targets --all-features
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-features --doc
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --locked --workspace --all-features --release
      - run: scripts/dev/fake-smoke.sh
        env:
          BIN_DIR: target/release
      - name: Agent Skills fake-broker acceptance
        if: matrix.runner == 'ubuntu-24.04'
        run: scripts/dev/skill-smoke.sh
        env:
          BIN_DIR: target/release
      - name: Prepare external MCP sandbox on disposable CI runner
        if: matrix.runner == 'ubuntu-24.04'
        run: scripts/dev/ci-bwrap-preflight.sh
      - name: Federated MCP daemon smoke
        if: matrix.runner == 'ubuntu-24.04'
        run: scripts/dev/federation-smoke.sh
        env:
          BIN_DIR: target/release
