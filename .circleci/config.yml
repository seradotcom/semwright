version: 2.1

# H preparation only; native evidence and final certification remain on Actions.
jobs:
  h-harness-iteration:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    environment:
      SW_HARNESS_SHA: 06e6f5a194f8f69d84ec3466ad0a0eba3367a0e0
    steps:
      - checkout
      - run:
          name: Validate immutable H preparation controls without engines or model access
          command: python3 scripts/circleci-iteration/run_h_harness.py
          no_output_timeout: 5m
      - store_artifacts:
          path: verification/circleci-harness
          destination: H-preparation-iteration

workflows:
  h-preparation-iteration:
    jobs:
      - h-harness-iteration:
          filters:
            branches:
              only: ci/h-circleci-iteration-06e6f5a
