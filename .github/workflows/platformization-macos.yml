name: Platformization and macOS

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'crates/platform-macos/**'
      - 'crates/platform-macos-sys/**'
      - 'crates/platform-common/**'
      - 'crates/platform-api/**'
      - 'crates/platform-services/**'
      - 'crates/driver-host/**'
      - 'crates/plugin-host/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/platformization-macos.yml'
  pull_request:
    paths:
      - 'crates/platform-macos/**'
      - 'crates/platform-macos-sys/**'
      - 'crates/platform-common/**'
      - 'crates/platform-api/**'
      - 'crates/platform-services/**'
      - 'crates/driver-host/**'
      - 'crates/plugin-host/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/platformization-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platformization-macos-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  linux-regression:
    if: ${{ !(vars.SEMWRIGHT_PAUSE_MAIN_CI == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1
      - name: Install Linux media development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev
      - name: Platformized Linux regression
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked --workspace --all-targets --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-targets --all-features
          cargo test --locked --workspace --all-features --doc
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --all-features --no-deps
          python3 scripts/verify-source.py

  macos-native:
    if: ${{ !(vars.SEMWRIGHT_PAUSE_MAIN_CI == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15
            native: aarch64-apple-darwin
            other: x86_64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            native: x86_64-apple-darwin
            other: aarch64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1
      - name: Record native Apple environment
        run: |
          set -euo pipefail
          mkdir -p verification/platform-ci
          {
            sw_vers
            uname -a
            uname -m
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            rustc --version --verbose
            cargo --version
          } | tee "verification/platform-ci/environment-${{ matrix.arch }}.log"
          test "$(uname -m)" = "${{ matrix.arch }}"
          rustup target add "${{ matrix.native }}" "${{ matrix.other }}"

      - name: Cross-check Rust-only portable contracts
        run: |
          set -euo pipefail
          cargo check --locked --target "${{ matrix.other }}"             -p semwright-types             -p semwright-backend-api             -p semwright-platform-api             -p semwright-registry             -p semwright-recipes
      - name: Compile macOS-capable workspace against native SDK
        run: |
          set -euo pipefail
          # These drivers deliberately reject non-Linux builds until their
          # native containment/IPC layers are ported. Keep those boundaries
          # explicit instead of weakening their fail-closed compile guards.
          cargo check --locked --workspace             --exclude semwright-mlt-video-driver             --exclude semwright-kicad-driver             --exclude kicad-ipc             --all-targets --all-features             2>&1 | tee "verification/platform-ci/workspace-check-${{ matrix.arch }}.log"

      - name: Run native platform contract tests
        run: |
          set -euo pipefail
          cargo test --locked             -p semwright-platform-api             -p semwright-platform-macos             -p semwright-platform-macos-sys             -p semwright-platform-services             -p semwright-platform-host             --all-features             2>&1 | tee "verification/platform-ci/platform-tests-${{ matrix.arch }}.log"

      - name: Link daemon and frontends
        run: |
          set -euo pipefail
          cargo build --locked --release             -p semwright-daemon             -p semwright-cli             -p semwright-mcp             -p semwright-plugin-host             -p semwright-driver-host             2>&1 | tee "verification/platform-ci/native-build-${{ matrix.arch }}.log"
      - name: Safe native smoke without TCC prompts
        run: |
          set -euo pipefail
          bash platforms/macos/tests/run-native-smoke.sh             2>&1 | tee "verification/platform-ci/native-smoke-${{ matrix.arch }}.log"

      - name: State live-acceptance boundary
        run: |
          {
            echo "PASS: native SDK compile/link and noninteractive smoke are exercised by this job."
            echo "NOT_RUN: Accessibility consent, CGEvent control, ScreenCaptureKit capture,"
            echo "TCC grant/revocation, installed service, codesign/notarization and live multi-display acceptance."
          } | tee "verification/platform-ci/live-boundary-${{ matrix.arch }}.log"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: platform-macos-${{ matrix.arch }}-evidence
          path: verification/platform-ci
          retention-days: 14
