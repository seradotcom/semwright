          cargo test --locked -p kicad-ipc -p semwright-kicad-driver 2>&1 | tee verification/native-ci/kicad-rust-tests.log
          cargo clippy --locked -p kicad-ipc -p semwright-kicad-driver --all-targets -- -D warnings
      - name: Real DriverProvider sandbox conformance
