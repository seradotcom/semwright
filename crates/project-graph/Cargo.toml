[package]
name = "semwright-project-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Evidence-scoped persistent project identity, provenance and impact queries"

[features]
default = []
store = ["dep:rusqlite", "dep:semwright-platform-services", "dep:libc"]

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"], optional = true }
semwright-platform-services = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
uuid.workspace = true
semwright-semantic-composition.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true

[lints]
workspace = true
