name: Audio diagnostics
on:
  push:
    branches: [feat/audio-completion]
    paths:
      - 'crates/audio-domain/**'
      - 'crates/audio-authoring/**'
      - 'crates/driver-faust-audio/**'
      - 'crates/driver-ardour-audio/**'
      - 'crates/semantic-composition/**'
      - 'crates/media-time/**'
      - 'crates/driver-sdk/**'
      - 'crates/driver-host/**'
      - 'crates/policy/**'
      - 'scripts/audio/**'
      - 'scripts/dev/ci-driver-bwrap-profile.sh'
      - 'docs/audio/**'
      - 'skills/semwright-audio-production/**'
      - 'fuzz/Cargo.toml'
      - 'fuzz/fuzz_targets/audio_*.rs'
      - 'fuzz/corpus/audio_*/**'
      - 'integrations/audio/**'
      - '.github/workflows/audio-diagnostics.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_dispatch:
    inputs:
      scope:
        description: "Affected lane for iteration; certify runs the complete integration candidate"
        required: true
        default: affected
        type: choice
        options:
          - affected
          - domain
          - faust
          - analysis
          - ardour
          - fuzz
          - portable
          - certify
      candidate_sha:
        description: "Required for certify; must equal the exact checked-out candidate SHA"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: audio-diagnostics-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'certify' && github.sha || 'iteration' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.scope != 'certify' }}
defaults:
  run:
    shell: bash
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      domain: ${{ steps.scope.outputs.domain }}
      faust: ${{ steps.scope.outputs.faust }}
      analysis: ${{ steps.scope.outputs.analysis }}
      ardour: ${{ steps.scope.outputs.ardour }}
      fuzz: ${{ steps.scope.outputs.fuzz }}
      portable: ${{ steps.scope.outputs.portable }}
      certify: ${{ steps.scope.outputs.certify }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        name: Select affected audio lanes
        env:
          REQUESTED_SCOPE: ${{ inputs.scope || 'affected' }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          domain=false
          faust=false
          analysis=false
          ardour=false
          fuzz=false
          portable=false
          certify=false

          select_manual_scope() {
            case "$REQUESTED_SCOPE" in
              domain) domain=true ;;
              faust) faust=true ;;
              analysis) analysis=true ;;
              ardour) ardour=true ;;
              fuzz) domain=true; fuzz=true ;;
              portable) domain=true; portable=true ;;
              certify)
                domain=true
                faust=true
                analysis=true
                ardour=true
                fuzz=true
                portable=true
                certify=true
                ;;
              affected) ;;
              *) echo "unknown scope: $REQUESTED_SCOPE" >&2; exit 2 ;;
            esac
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_SCOPE" != "affected" ]]; then
            if [[ "$REQUESTED_SCOPE" == "certify" ]]; then
              if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "certify requires candidate_sha as a full lowercase 40-hex SHA" >&2
                exit 2
              fi
              if [[ "$CANDIDATE_SHA" != "$GITHUB_SHA" ]]; then
                echo "candidate_sha=$CANDIDATE_SHA does not match checked-out GITHUB_SHA=$GITHUB_SHA" >&2
                exit 1
              fi
              echo "Exact candidate certified by request: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
            fi
            select_manual_scope
          else
            base="$PUSH_BEFORE"
            head="$GITHUB_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse "$head^" 2>/dev/null || printf '%s' "$head")"
            fi
            git diff --name-only "$base" "$head" > "$RUNNER_TEMP/audio-changed-paths.txt"
            cat "$RUNNER_TEMP/audio-changed-paths.txt"

            while IFS= read -r path; do
              case "$path" in
                crates/driver-ardour-audio/*)
                  ardour=true
                  ;;
                crates/driver-faust-audio/*|integrations/audio/faust-runtime/*)
                  faust=true
                  ;;
                integrations/audio/analysis-runtime/*)
                  analysis=true
                  ;;
                crates/audio-domain/*|crates/audio-authoring/*)
                  domain=true
                  ;;
                fuzz/Cargo.toml|fuzz/fuzz_targets/audio_*|fuzz/corpus/audio_*/*)
                  domain=true
                  fuzz=true
                  ;;
                crates/semantic-composition/*|crates/media-time/*|crates/driver-sdk/*|crates/driver-host/*|crates/policy/*|scripts/audio/*|scripts/dev/ci-driver-bwrap-profile.sh|Cargo.toml|Cargo.lock)
                  domain=true
                  faust=true
                  analysis=true
                  ardour=true
                  ;;
                *)
                  ;;
              esac
            done < "$RUNNER_TEMP/audio-changed-paths.txt"
          fi

          {
            echo "domain=$domain"
            echo "faust=$faust"
            echo "analysis=$analysis"
            echo "ardour=$ardour"
            echo "fuzz=$fuzz"
            echo "portable=$portable"
            echo "certify=$certify"
          } | tee -a "$GITHUB_OUTPUT"

  audio-domain:
    needs: [scope]
    if: needs.scope.outputs.domain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: audio-v1-portable
      - name: Portable tests and zero-test guard
        run: python3 scripts/audio/run-suite.py portable
      - name: Format and lint
        run: |
          cargo fmt -p semwright-audio-authoring -p semwright-audio-domain -p semwright-faust-audio-driver -p semwright-ardour-audio-driver -- --check
          cargo clippy --locked -p semwright-audio-authoring -p semwright-audio-domain -p semwright-faust-audio-driver -p semwright-ardour-audio-driver --all-targets -- -D warnings
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audio-portable-${{ github.sha }}
          path: verification/audio
          retention-days: 7
          if-no-files-found: error
  audio-portable-cross:
    needs: [scope, audio-domain]
    if: needs.scope.outputs.portable == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: audio-v1-portable-${{ matrix.os }}
      - name: Portable audio tests
        run: python3 scripts/audio/run-suite.py portable
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audio-portable-${{ matrix.os }}-${{ github.sha }}
          path: verification/audio
          retention-days: 7
          if-no-files-found: error
  faust-native:
    needs: [scope]
    if: needs.scope.outputs.faust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            version: 2.37.3
            package: faust=2.37.3~ds0-1
            cache: jammy
          - os: ubuntu-24.04
            version: 2.70.3
            package: faust=2.70.3+ds-1.1build2
            cache: noble
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: audio-v3-faust-${{ matrix.cache }}
      - name: Install runner-only Faust runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y "${{ matrix.package }}" libsndfile1-dev bubblewrap libpipewire-0.3-dev strace
          mkdir -p verification/audio
          dpkg-query -W faust libsndfile1-dev > verification/audio/runtime-packages.txt
          sha256sum /usr/bin/faust > verification/audio/faust.sha256
          faust --version > verification/audio/faust-version.txt
      - name: Check namespace prerequisite on Ubuntu 22.04
        if: matrix.os == 'ubuntu-22.04'
        run: |
          bwrap --die-with-parent --unshare-all --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 --proc /proc --dev /dev -- /usr/bin/true
      - name: Install scoped Driver Host sandbox profile on Ubuntu 24.04
        if: matrix.os == 'ubuntu-24.04'
        run: |
          bash scripts/dev/ci-driver-bwrap-profile.sh verification/audio/faust-sandbox-setup.log
      - name: Build fixed interpreter and sandbox binaries on runner
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror integrations/audio/faust-runtime/main.cpp -lfaust -lsndfile -o "$RUNNER_TEMP/semwright-faust-interpreter"
          cargo build --locked -p semwright-plugin-host -p semwright-faust-audio-driver --bins
          find target/debug -maxdepth 1 -type f -name '*sandbox*' -print
      - name: Faust confinement differential diagnostics
        run: |
          scripts/audio/faust-confinement-diagnostics.sh             "$RUNNER_TEMP/semwright-faust-interpreter"             "$GITHUB_WORKSPACE/target/debug/semwright-sandbox"             /usr/share/faust             verification/audio/faust-confinement
      - name: Real Faust translation and helper diagnostics
        run: |
          export SEMWRIGHT_TEST_FAUST_HELPER="$RUNNER_TEMP/semwright-faust-interpreter"
          python3 scripts/audio/run-suite.py faust
      - name: Broker to sealed interpreter and independent PCM oracle
        run: |
          export SEMWRIGHT_TEST_FAUST_VERSION="${{ matrix.version }}"
          export SEMWRIGHT_TEST_FAUST_HELPER="$RUNNER_TEMP/semwright-faust-interpreter"
          export SEMWRIGHT_TEST_SANDBOX_HELPER="$GITHUB_WORKSPACE/target/debug/semwright-sandbox"
          python3 scripts/audio/run-suite.py faust-host
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audio-faust-${{ matrix.version }}-${{ github.sha }}
          path: verification/audio
          retention-days: 7
          if-no-files-found: error
  analysis-native:
    needs: [scope]
    if: needs.scope.outputs.analysis == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: audio-v1-analysis-noble
      - name: Install pinned analysis runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libebur128-dev=1.2.6-1build1 libsndfile1-dev bubblewrap libpipewire-0.3-dev
          mkdir -p verification/audio
          dpkg-query -W libebur128-dev libsndfile1-dev > verification/audio/analysis-runtime-packages.txt
      - name: Install scoped Driver Host sandbox profile
        run: |
          bash scripts/dev/ci-driver-bwrap-profile.sh verification/audio/analysis-sandbox-setup.log
      - name: Build fixed meter and sandbox binaries on runner
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror integrations/audio/analysis-runtime/main.cpp -lebur128 -lsndfile -o "$RUNNER_TEMP/semwright-audio-meter"
          cargo build --locked -p semwright-plugin-host -p semwright-faust-audio-driver --bins
      - name: Broker to sealed libebur128 meter with independent WAV oracle
        run: |
          export SEMWRIGHT_TEST_AUDIO_METER="$RUNNER_TEMP/semwright-audio-meter"
          export SEMWRIGHT_TEST_SANDBOX_HELPER="$GITHUB_WORKSPACE/target/debug/semwright-sandbox"
          python3 scripts/audio/run-suite.py analysis-host
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audio-analysis-${{ github.sha }}
          path: verification/audio
          retention-days: 7
          if-no-files-found: error
  ardour-native:
    needs: [scope]
    if: needs.scope.outputs.ardour == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: audio-v1-ardour84-noble
      - name: Ardour driver source quality
        run: |
          cargo fmt -p semwright-ardour-audio-driver -- --check
          cargo clippy --locked -p semwright-ardour-audio-driver --all-targets -- -D warnings
          cargo test --locked -p semwright-ardour-audio-driver --lib --tests
      - name: Install pinned Ardour runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y 'ardour=1:8.4.0+ds1-2ubuntu8' 'ardour-data=1:8.4.0+ds1-2ubuntu8' bubblewrap libpipewire-0.3-dev
          mkdir -p verification/audio
          dpkg-query -W ardour ardour-data > verification/audio/ardour-runtime-packages.txt
      - name: Locate exact internal Ardour utilities
        run: |
          LUA="$(find /usr/lib -type f -path '*ardour8*' -name 'luasession' -perm /111 -print -quit)"
          CREATE="$(find /usr/lib -type f -path '*ardour8*' -name 'ardour8-new_session' -perm /111 -print -quit)"
          EXPORT="$(find /usr/lib -type f -path '*ardour8*' -name 'ardour8-export' -perm /111 -print -quit)"
          test -n "$LUA" && test -n "$CREATE" && test -n "$EXPORT"
          {
            echo "SEMWRIGHT_TEST_ARDOUR_LUA=$LUA"
            echo "SEMWRIGHT_TEST_ARDOUR_CREATE=$CREATE"
            echo "SEMWRIGHT_TEST_ARDOUR_EXPORT=$EXPORT"
          } >> "$GITHUB_ENV"
          sha256sum "$LUA" "$CREATE" "$EXPORT" > verification/audio/ardour-tools.sha256
          echo "runtime=ardour 8.4.0; ubuntu_package=1:8.4.0+ds1-2ubuntu8" > verification/audio/ardour-tool-baseline.txt
      - name: Direct Ardour managed-create control
        run: |
          DIRECT_HOME="$RUNNER_TEMP/ardour-direct-home"
          DIRECT_SESSION="$RUNNER_TEMP/ardour-direct-session"
          mkdir -p "$DIRECT_HOME"
          env -i             HOME="$DIRECT_HOME"             LANG=C.UTF-8             LC_ALL=C.UTF-8             PATH=/usr/bin:/bin             LD_LIBRARY_PATH=/usr/lib/ardour8             ARDOUR_DATA_PATH=/usr/share/ardour8             ARDOUR_CONFIG_PATH=/etc/ardour8             ARDOUR_DLL_PATH=/usr/lib/ardour8             VAMP_PATH=/usr/lib/ardour8/vamp             "$SEMWRIGHT_TEST_ARDOUR_CREATE" -s 48000 "$DIRECT_SESSION" Direct             > verification/audio/ardour-direct-create.stdout             2> verification/audio/ardour-direct-create.stderr
          test -s "$DIRECT_SESSION/Direct.ardour"
      - name: Install scoped Driver Host sandbox profile
        run: |
          bash scripts/dev/ci-driver-bwrap-profile.sh verification/audio/ardour-sandbox-setup.log
      - name: Build Ardour driver and Driver Host sandbox
        run: |
          cargo build --locked -p semwright-plugin-host -p semwright-ardour-audio-driver --bins
      - name: Direct pinned Ardour persistent automation diagnostic
        run: |
          cargo test --locked -p semwright-ardour-audio-driver \
            runtime::tests::persisted_plugin_automation_native_diagnostic \
            -- --ignored --exact --nocapture
      - name: Broker to sealed Ardour create edit save reopen export
        run: |
          export SEMWRIGHT_TEST_SANDBOX_HELPER="$GITHUB_WORKSPACE/target/debug/semwright-sandbox"
          python3 scripts/audio/run-suite.py ardour-host
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audio-ardour-${{ github.sha }}
          path: verification/audio
          retention-days: 7
          if-no-files-found: error
  audio-fuzz:
    needs: [scope, audio-domain]
    if: needs.scope.outputs.fuzz == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-09-18
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: audio-v1-fuzz
          workspaces: fuzz
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo +1.98.1 install --locked cargo-fuzz --version 0.13.2
      - name: Bounded targeted audio fuzz
        run: |
          mkdir -p verification/audio/fuzz
          for target in audio_domain_model audio_domain_edit audio_wav; do
            cargo +nightly-2026-09-18 fuzz run "$target" -- -max_total_time=15 -timeout=3 -rss_limit_mb=1024 -max_len=32768 2>&1 | tee "verification/audio/fuzz/$target.log"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audio-fuzz-${{ github.sha }}
          path: |
            verification/audio/fuzz
            fuzz/artifacts
          retention-days: 7
          if-no-files-found: warn
  audio-package:
    needs: [scope, audio-domain, faust-native, analysis-native, ardour-native]
    if: needs.scope.outputs.certify == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: audio-v1-development-packages
      - name: Install pinned package-time native runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y faust=2.70.3+ds-1.1build2 libsndfile1-dev libebur128-dev=1.2.6-1build1 'ardour=1:8.4.0+ds1-2ubuntu8' 'ardour-data=1:8.4.0+ds1-2ubuntu8' libpipewire-0.3-dev
      - name: Build drivers, CLI and fixed Semwright helpers
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror integrations/audio/faust-runtime/main.cpp -lfaust -lsndfile -o "$RUNNER_TEMP/semwright-faust-interpreter"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror integrations/audio/analysis-runtime/main.cpp -lebur128 -lsndfile -o "$RUNNER_TEMP/semwright-audio-meter"
          cargo build --locked -p semwright-plugin-host -p semwright-cli -p semwright-faust-audio-driver -p semwright-ardour-audio-driver --bins
      - name: Locate pinned Ardour utilities
        run: |
          LUA="$(find /usr/lib -type f -path '*ardour8*' -name 'luasession' -perm /111 -print -quit)"
          CREATE="$(find /usr/lib -type f -path '*ardour8*' -name 'ardour8-new_session' -perm /111 -print -quit)"
          EXPORT="$(find /usr/lib -type f -path '*ardour8*' -name 'ardour8-export' -perm /111 -print -quit)"
          test -n "$LUA" && test -n "$CREATE" && test -n "$EXPORT"
          {
            echo "SEMWRIGHT_PACKAGE_ARDOUR_LUA=$LUA"
            echo "SEMWRIGHT_PACKAGE_ARDOUR_CREATE=$CREATE"
            echo "SEMWRIGHT_PACKAGE_ARDOUR_EXPORT=$EXPORT"
          } >> "$GITHUB_ENV"
      - name: Create and inspect real development packages
        run: |
          python3 scripts/audio/package-development.py             --semwright "$GITHUB_WORKSPACE/target/debug/semwright"             --faust-driver "$GITHUB_WORKSPACE/target/debug/semwright-faust-audio-driver"             --analysis-driver "$GITHUB_WORKSPACE/target/debug/semwright-audio-analysis-driver"             --ardour-driver "$GITHUB_WORKSPACE/target/debug/semwright-ardour-audio-driver"             --faust-helper "$RUNNER_TEMP/semwright-faust-interpreter"             --audio-meter "$RUNNER_TEMP/semwright-audio-meter"             --ardour-lua "$SEMWRIGHT_PACKAGE_ARDOUR_LUA"             --ardour-create "$SEMWRIGHT_PACKAGE_ARDOUR_CREATE"             --ardour-export "$SEMWRIGHT_PACKAGE_ARDOUR_EXPORT"             --faust-libraries /usr/share/faust             --output verification/audio/packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audio-development-packages-${{ github.sha }}
          path: verification/audio/packages
          retention-days: 30
          if-no-files-found: error
  audio-iteration-gate:
    if: always() && needs.scope.outputs.certify != 'true'
    needs: [scope, audio-domain, audio-portable-cross, faust-native, analysis-native, ardour-native, audio-fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every selected iteration lane must pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DOMAIN_SELECTED: ${{ needs.scope.outputs.domain }}
          FAUST_SELECTED: ${{ needs.scope.outputs.faust }}
          ANALYSIS_SELECTED: ${{ needs.scope.outputs.analysis }}
          ARDOUR_SELECTED: ${{ needs.scope.outputs.ardour }}
          FUZZ_SELECTED: ${{ needs.scope.outputs.fuzz }}
          PORTABLE_SELECTED: ${{ needs.scope.outputs.portable }}
          DOMAIN_RESULT: ${{ needs.audio-domain.result }}
          CROSS_RESULT: ${{ needs.audio-portable-cross.result }}
          FAUST_RESULT: ${{ needs.faust-native.result }}
          ANALYSIS_RESULT: ${{ needs.analysis-native.result }}
          ARDOUR_RESULT: ${{ needs.ardour-native.result }}
          FUZZ_RESULT: ${{ needs.audio-fuzz.result }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          check_selected() {
            local selected="$1"
            local result="$2"
            local name="$3"
            if [[ "$selected" == "true" && "$result" != "success" ]]; then
              echo "$name was selected but finished as $result" >&2
              exit 1
            fi
          }
          check_selected "$DOMAIN_SELECTED" "$DOMAIN_RESULT" audio-domain
          check_selected "$PORTABLE_SELECTED" "$CROSS_RESULT" audio-portable-cross
          check_selected "$FAUST_SELECTED" "$FAUST_RESULT" faust-native
          check_selected "$ANALYSIS_SELECTED" "$ANALYSIS_RESULT" analysis-native
          check_selected "$ARDOUR_SELECTED" "$ARDOUR_RESULT" ardour-native
          check_selected "$FUZZ_SELECTED" "$FUZZ_RESULT" audio-fuzz

  audio-gate:
    if: always() && needs.scope.outputs.certify == 'true'
    needs: [scope, audio-domain, audio-portable-cross, faust-native, analysis-native, ardour-native, audio-fuzz, audio-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every certification lane must run and pass
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          DOMAIN_RESULT: ${{ needs.audio-domain.result }}
          CROSS_RESULT: ${{ needs.audio-portable-cross.result }}
          FAUST_RESULT: ${{ needs.faust-native.result }}
          ANALYSIS_RESULT: ${{ needs.analysis-native.result }}
          ARDOUR_RESULT: ${{ needs.ardour-native.result }}
          FUZZ_RESULT: ${{ needs.audio-fuzz.result }}
          PACKAGE_RESULT: ${{ needs.audio-package.result }}
        run: |
          set -euo pipefail
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          test "$SCOPE_RESULT" = success
          test "$DOMAIN_RESULT" = success
          test "$CROSS_RESULT" = success
          test "$FAUST_RESULT" = success
          test "$ANALYSIS_RESULT" = success
          test "$ARDOUR_RESULT" = success
          test "$FUZZ_RESULT" = success
          test "$PACKAGE_RESULT" = success
          mkdir -p verification/audio
          python3 - <<'PY'
          import json, os
          payload = {
              "schema_version": 1,
              "status": "PASS",
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "github_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "lanes": {
                  "audio-domain": os.environ["DOMAIN_RESULT"],
                  "audio-portable-cross": os.environ["CROSS_RESULT"],
                  "faust-native": os.environ["FAUST_RESULT"],
                  "analysis-native": os.environ["ANALYSIS_RESULT"],
                  "ardour-native": os.environ["ARDOUR_RESULT"],
                  "audio-fuzz": os.environ["FUZZ_RESULT"],
                  "audio-package": os.environ["PACKAGE_RESULT"],
              },
          }
          with open("verification/audio/final-certification.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audio-final-certification-${{ github.sha }}
          path: verification/audio/final-certification.json
          retention-days: 30
          if-no-files-found: error
