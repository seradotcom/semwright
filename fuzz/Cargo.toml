[package]
name = "semwright-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
semwright-platform-macos-sys = { path = "../crates/platform-macos-sys" }
semwright-platform-api = { path = "../crates/platform-api" }
libfuzzer-sys = "0.4"
serde_json = "1"
semwright-types = { path = "../crates/types" }
semwright-protocol = { path = "../crates/protocol" }
semwright-plugin-sdk = { path = "../crates/plugin-sdk" }
semwright-policy = { path = "../crates/policy" }
semwright-recipes = { path = "../crates/recipes" }
semwright-obs-driver = { package = "semwright-driver-obs", path = "../crates/driver-obs" }

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false

