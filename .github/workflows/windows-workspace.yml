name: Windows workspace connection

on:
  push:
    branches: [fix/windows-workspace-roots]
  pull_request:
    paths:
      - 'crates/daemon/src/config.rs'
      - 'crates/daemon/tests/windows_workspace.rs'
      - 'crates/daemon/src/server.rs'
      - 'crates/platform-windows/**'
      - 'crates/platform-windows-sys/**'
      - 'crates/platform-services/src/lib.rs'
      - 'crates/cli/**'
      - 'crates/mcp/**'
      - 'crates/protocol/**'
      - 'crates/core/src/lib.rs'
      - 'crates/core/tests/project_graph.rs'
      - 'schemas/commands.json'
      - 'scripts/windows/workspace-smoke.py'
      - 'scripts/windows/project-restart-smoke.py'
      - 'scripts/windows/delayed-hello-smoke.ps1'
      - 'scripts/windows/run-interactive-certification.ps1'
      - 'scripts/windows/validate-interactive-certification.ps1'
      - 'packaging/portable/**'
      - 'scripts/release/portable_package.py'
      - 'scripts/release/bundle_contract.py'
      - 'scripts/release/certify_install.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-workspace-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  workspace:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Check affected Rust formatting
        run: rustfmt --edition 2024 --check crates/daemon/src/config.rs crates/daemon/src/server.rs crates/daemon/tests/windows_workspace.rs crates/cli/src/lib.rs crates/cli/src/semwright.rs crates/platform-services/src/lib.rs crates/platform-windows-sys/src/paths.rs crates/platform-windows-sys/src/filesystem.rs crates/platform-windows-sys/src/window.rs crates/platform-windows/src/lib.rs crates/core/tests/project_graph.rs crates/protocol/src/lib.rs
      - name: Parse the interactive harness
        run: ./scripts/windows/validate-interactive-certification.ps1
      - name: Response-loss transport semantics
        run: cargo test --locked -p semwright-protocol --lib transport_outcome_tests
      - name: Window-scoped semantic snapshot contract
        run: cargo test --locked -p semwright-core --lib scoped_snapshot_tests
      - name: Windows project file-instance continuity
        run: |
          cargo test --locked -p semwright-core --test project_graph windows_native_project_asset_observes_human_edits_but_not_file_replacement
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p semwright-core --test project_graph windows_project_reopen_preserves_owner_and_reconciles_offline_edit
      - name: Workspace configuration and native confinement
        run: |
          cargo test --locked -p semwright-daemon --test windows_workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p semwright-platform-windows-sys --lib filesystem::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p semwright-platform-windows-sys --lib paths::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p semwright-platform-windows-sys --lib window::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p semwright-cli setup_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build local interfaces
        run: cargo build --locked -p semwright-daemon -p semwright-cli -p semwright-mcp -p semwright-tui -p semwright-plugin-host --bins
      - name: Native project restart with offline owner edit
        run: python scripts/windows/project-restart-smoke.py --bin-dir target/debug --output verification/windows-project-restart
      - name: Delayed and anonymous Windows pipe handshakes
        run: ./scripts/windows/delayed-hello-smoke.ps1 -BinDir target/debug -Output verification/windows-pipe
      - name: Build the bounded physical UIA case without running it
        run: |
          New-Item -ItemType Directory -Force verification/windows-uia | Out-Null
          cargo test --locked -p semwright-platform-windows --test uia_native_fixture --no-run --message-format json |
            Set-Content -Encoding utf8 verification/windows-uia/build.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixture = @(Get-Content verification/windows-uia/build.json | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object {
            $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'uia_native_fixture' -and $_.profile.test -and $_.executable
          })
          if ($fixture.Count -ne 1) { throw 'Expected one UIA test executable from Cargo.' }
          $binary = 'verification/windows-uia/uia-native-fixture.exe'
          Copy-Item -LiteralPath $fixture[0].executable -Destination $binary
          @{
            source = '${{ github.sha }}'; name = 'uia-native-fixture.exe'
            sha256 = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
            runner = 'windows-2025'; built_only = $true; interactive_accepted = $false
          } | ConvertTo-Json | Set-Content -Encoding utf8 verification/windows-uia/manifest.json
      - name: Real broker and MCP workspace roundtrip
        run: python scripts/windows/workspace-smoke.py --bin-dir target/debug --output verification/windows-workspace
      - name: Package Windows delivery and check install lifecycle
        run: python scripts/release/portable_package.py --bin-dir target/debug --platform windows --arch x86_64 --output dist/windows-workspace --report verification/windows-workspace/package.json
      - name: Bind binary hashes to source
        if: success()
        run: |
          $paths = @('semwright.exe', 'semwrightd.exe', 'semwright-mcp.exe', 'semwright-inspect.exe', 'semwright-sandbox.exe')
          $binaries = @($paths | ForEach-Object {
            $file = Join-Path 'target/debug' $_
            @{ name = $_; sha256 = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant() }
          })
          @{ source = '${{ github.sha }}'; runner = 'windows-2025'; binaries = $binaries } |
            ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 verification/windows-workspace/binaries.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-workspace-evidence
          path: |
            verification/windows-workspace/
            verification/windows-pipe/
            verification/windows-project-restart/
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: windows-workspace-binaries
          path: |
            target/debug/semwright.exe
            target/debug/semwrightd.exe
            target/debug/semwright-mcp.exe
            target/debug/semwright-inspect.exe
            target/debug/semwright-sandbox.exe
            verification/windows-workspace/binaries.json
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: windows-uia-physical-test
          path: |
            verification/windows-uia/uia-native-fixture.exe
            verification/windows-uia/manifest.json
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: windows-workspace-portable
          path: dist/windows-workspace/
          retention-days: 7

  unix-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1
      - name: Install Linux platform dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev
      - name: Shared setup, configuration and transport checks
        run: |
          cargo test --locked -p semwright-cli setup_
          cargo test --locked -p semwright-daemon --lib config::tests
          cargo test --locked -p semwright-protocol --lib transport_outcome_tests
          cargo test --locked -p semwright-core --lib scoped_snapshot_tests
