# Copy to a user-owned, mode-0600 config. Replace the project root before use.
# Top-level settings MUST precede [policy] in TOML.
# blender_socket = "/run/user/1000/semwright-blender/bridge.sock"
# plugins = ["/home/YOUR_USER/.config/semwright/stats.json"]

# Linux application launch targets are explicit owner pins, never PATH discovery.
# [applications.editor]
# executable = "/absolute/canonical/path/to/application"
# sha256 = "<64 lowercase hexadecimal characters>"
# args = []
# cwd = "/absolute/owner/working-directory"

[policy]
profile = "workspace"
allow = ["blender.observe", "blender.modify", "browser.observe", "browser.modify"]

[[policy.filesystem]]
name = "project"
path = "/home/YOUR_USER/projects/example"
read = true
write = true

# Cross-driver artifact handoff uses named grants, never host absolute paths in commands.
# A producer and consumer may use distinct roots; artifact.handoff requires source read +
# destination write authority and preserves SHA-256 across the copy.
# [[policy.filesystem]]
# name = "asset-output"
# path = "/home/YOUR_USER/projects/assets"
# read = true
# write = true

[browser]
# Browser launch is disabled by default. To enable the Linux built-in Chromium backend,
# uncomment both fields and pin the exact canonical executable selected by the owner.
# executable = "/absolute/canonical/path/to/chromium-family-executable"
# sha256 = "<64 lowercase hexadecimal characters>"
allowed_origins = ["http://127.0.0.1:8000"]
allow_downloads = false
