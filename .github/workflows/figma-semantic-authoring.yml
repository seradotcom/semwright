name: Figma semantic authoring

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/driver-figma/**"
      - "crates/semantic-composition/**"
      - "demos/figma-semantic-authoring/**"
      - "fuzz/fuzz_targets/figma_composition.rs"
      - "fuzz/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/figma-semantic-authoring.yml"

permissions:
  contents: read

concurrency:
  group: figma-semantic-authoring-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  authoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: crates/driver-figma/plugin/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: figma-semantic-authoring
      - name: Install sandbox and native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils libpipewire-0.3-dev
          mkdir -p verification/figma-semantic-authoring
      - name: Preflight Bubblewrap without weakening AppArmor
        run: |
          current_userns=$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          if [ "$current_apparmor" = "1" ]; then
            PROFILE=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            test -f "$PROFILE"
            cp "$PROFILE" "$RUNNER_TEMP/figma-bwrap-userns-restrict"
            python3 - "$RUNNER_TEMP/figma-bwrap-userns-restrict" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          old = "flags=(attach_disconnected)"
          if text.count(old) != 2:
              raise SystemExit("unexpected bwrap AppArmor flag shape")
          text = text.replace(old, "flags=(attach_disconnected,mediate_deleted)")
          parent = "allow px /** -> bwrap//&unpriv_bwrap,"
          nested = "allow pix /** -> &unpriv_bwrap,"
          if text.count(parent) != 1 or text.count(nested) != 1:
              raise SystemExit("unexpected bwrap AppArmor exec-rule shape")
          text = text.replace("  " + parent, "\n".join([
              "  allow px /plugin/sandbox -> bwrap//&unpriv_bwrap,",
              "  allow ix /plugin/bin,",
              "  allow ix /workspace/**,",
              "  allow ix /usr/**,",
              "  allow ix /tmp/**,",
          ]))
          text = text.replace("  " + nested, "\n".join([
              "  allow ix /plugin/bin,",
              "  allow ix /workspace/**,",
              "  allow ix /usr/**,",
              "  allow ix /tmp/**,",
          ]))
          path.write_text(text)
          PY
            sudo install -m 0644 "$RUNNER_TEMP/figma-bwrap-userns-restrict" /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
            test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "1"
          fi
          bwrap --version | tee verification/figma-semantic-authoring/bwrap.log
      - name: Rust format and targeted tests
        run: |
          cargo fmt --all -- --check
          cargo test --locked -p semwright-driver-figma --all-targets --all-features             2>&1 | tee verification/figma-semantic-authoring/rust-tests.log
      - name: Build driver, fake Figma and sandbox helper
        run: |
          cargo build --locked -p semwright-driver-figma --features test-tools --bins             -p semwright-plugin-host --bin semwright-sandbox             2>&1 | tee verification/figma-semantic-authoring/build.log
      - name: Catalog and public API completeness
        run: |
          python3 crates/driver-figma/tools/catalog_consistency.py             | tee verification/figma-semantic-authoring/catalog.log
      - name: Figma plugin tests and coverage
        working-directory: crates/driver-figma/plugin
        run: |
          npm ci --ignore-scripts
          node ../tools/api_coverage.mjs | tee ../../../verification/figma-semantic-authoring/api-coverage.log
          python3 ../tools/rest_api_coverage.py | tee ../../../verification/figma-semantic-authoring/rest-coverage.log
          python3 ../tools/semantic_completeness.py | tee ../../../verification/figma-semantic-authoring/semantic-completeness.log
          npm test 2>&1 | tee ../../../verification/figma-semantic-authoring/plugin-tests.log
          npm run typecheck 2>&1 | tee ../../../verification/figma-semantic-authoring/typecheck.log
          npm run build 2>&1 | tee ../../../verification/figma-semantic-authoring/plugin-build.log
      - name: Driver Protocol semantic authoring E2E
        run: |
          BIN_DIR="$GITHUB_WORKSPACE/target/debug"             python3 crates/driver-figma/tools/e2e_driver.py             | tee verification/figma-semantic-authoring/e2e.log
      - name: Semantic convergence demo and structural A/B/C benchmark
        run: |
          python3 demos/figma-semantic-authoring/build_demo_spec.py
          git diff --exit-code -- demos/figma-semantic-authoring/semwright-landing.composition.json
          BIN_DIR="$GITHUB_WORKSPACE/target/debug" \
            SEMWRIGHT_FIGMA_DEMO_OUT="$GITHUB_WORKSPACE/verification/figma-semantic-authoring/convergence-demo.json" \
            python3 demos/figma-semantic-authoring/convergence_demo.py \
            | tee verification/figma-semantic-authoring/convergence-demo.log
          BIN_DIR="$GITHUB_WORKSPACE/target/debug" \
            SEMWRIGHT_FIGMA_BENCHMARK_OUT="$GITHUB_WORKSPACE/verification/figma-semantic-authoring/benchmark.json" \
            python3 demos/figma-semantic-authoring/benchmark.py \
            | tee verification/figma-semantic-authoring/benchmark.log
      - name: Sandboxed DriverProvider semantic authoring
        env:
          SEMWRIGHT_TEST_FIGMA: "1"
          SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/target/debug/semwright-sandbox
        run: |
          cargo test --locked -p semwright-driver-figma --features test-tools             --test host_conformance -- --ignored --nocapture             2>&1 | tee verification/figma-semantic-authoring/host-conformance.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: figma-semantic-authoring-evidence
          path: verification/figma-semantic-authoring
          retention-days: 14

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-09-18
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: figma-semantic-authoring-fuzz
          workspaces: fuzz
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo +1.98.1 install --locked cargo-fuzz --version 0.13.2
      - name: Fuzz composition spec and ChangeSet parser
        run: |
          mkdir -p verification/figma-semantic-authoring
          cargo +nightly-2026-09-18 fuzz run figma_composition --             -max_total_time=45 -timeout=3 -rss_limit_mb=1024 -max_len=8192             2>&1 | tee verification/figma-semantic-authoring/fuzz-figma-composition.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: figma-semantic-authoring-fuzz
          path: |
            verification/figma-semantic-authoring
            fuzz/artifacts/figma_composition
          retention-days: 14
