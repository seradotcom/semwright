name: Quality gates
# Explicit Bash enables pipefail so tee cannot mask a failing producer.
defaults:
  run:
    shell: bash
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: python -m pip install jsonschema PyYAML
      - run: python scripts/verify-source.py
      - run: python -m unittest discover -s tests/python -v
      - run: node --test tests/js/bridge.test.mjs
      - run: |
          gcc -Wall -Wextra -Werror -O2 tests/native/openat2.c -o "$RUNNER_TEMP/semwright-openat2"
          fixture=$(mktemp -d)
          "$RUNNER_TEMP/semwright-openat2" "$fixture"
  static-lints:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install pinned static lint tools
        run: |
          python -m pip install "ruff==0.13.2"
          sudo apt-get update
          sudo apt-get install -y shellcheck
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -fsSLo "$RUNNER_TEMP/actionlint/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' \
            "$RUNNER_TEMP/actionlint/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Ruff semantic Python lint
        run: ruff check . --select F,E9
      - name: ShellCheck repository scripts
        run: find scripts platforms -type f -name '*.sh' -print0 | sort -z | xargs -0 shellcheck
      - name: actionlint workflows and embedded shell
        run: actionlint

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: msrv-1.88
      - name: Install Linux media development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev
      - run: test -f Cargo.lock
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets --all-features
      - run: cargo build --locked --workspace --all-targets --all-features
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-features --doc
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --locked --workspace --all-features --release
      - run: scripts/dev/fake-smoke.sh
        env:
          BIN_DIR: target/release
      - run: scripts/dev/federation-smoke.sh
        env:
          BIN_DIR: target/release

  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Linux media development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev
      # A genuine locked dependency graph is mandatory.
      - run: test -f Cargo.lock
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets --all-features
      - run: cargo build --locked --workspace --all-targets --all-features
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-features --doc
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --locked --workspace --all-features --release
      - run: scripts/dev/fake-smoke.sh
        env:
          BIN_DIR: target/release
      - name: Federated MCP daemon smoke
        if: matrix.runner == 'ubuntu-24.04'
        run: scripts/dev/federation-smoke.sh
        env:
          BIN_DIR: target/release
