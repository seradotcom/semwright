name: Motion Canvas driver
on:
  workflow_dispatch:
    inputs:
      certify_all:
        description: 'Run full Motion certification for the checked-out candidate'
        required: false
        type: boolean
        default: false
      candidate_sha:
        description: 'Exact candidate SHA; required when certify_all=true'
        required: false
        type: string
      native_only:
        description: 'Iteration mode: run only the Linux native Driver Host/render lane'
        required: false
        type: boolean
        default: false
  workflow_call:
  push:
    branches: [feat/motion-canvas-driver]
  pull_request:
    paths:
      - 'crates/driver-motion-canvas/**'
      - 'crates/semantic-composition/**'
      - 'crates/media-time/**'
      - 'crates/motion-authoring/**'
      - 'integrations/composition/motion/**'
      - 'integrations/motion-canvas/**'
      - 'scripts/motion-canvas/**'
      - 'fixtures/motion-canvas/**'
      - 'demos/launch-film/**'
      - 'recipes/demo/**'
      - 'scripts/demo/**'
      - 'docs/motion-canvas/**'
      - 'fuzz/**'
      - '.github/workflows/motion-canvas.yml'
      - '.github/workflows/motion-canvas-launch-film.yml'
      - 'scripts/composition/ci-scope.py'
      - 'Cargo.lock'
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      motion: ${{ steps.scope.outputs.motion }}
      native_only: ${{ steps.scope.outputs.native_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: scope
        env:
          CERTIFY_ALL: ${{ inputs.certify_all }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          NATIVE_ONLY: ${{ inputs.native_only }}
        run: |
          if [ "$CERTIFY_ALL" = true ] && [ "$NATIVE_ONLY" = true ]; then
            echo 'native_only and certify_all are mutually exclusive' >&2
            exit 2
          fi
          if [ "$NATIVE_ONLY" = true ]; then
            echo 'motion=true' >> "$GITHUB_OUTPUT"
            echo 'native_only=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'native_only=false' >> "$GITHUB_OUTPUT"
          mode=iteration
          if [ "$CERTIFY_ALL" = true ]; then mode=certify; fi
          args=(--mode "$mode" --after "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT")
          if [ "$mode" = certify ]; then args+=(--candidate-sha "$CANDIDATE_SHA"); fi
          python scripts/composition/ci-scope.py "${args[@]}"
  domain:
    needs: scope
    if: ${{ needs.scope.outputs.motion == 'true' && needs.scope.outputs.native_only != 'true' }}
    concurrency:
      group: motion-domain-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motion-canvas-domain
      - name: Compile complete driver
        run: |
          mkdir -p verification/motion-canvas
          cargo check --locked -p semwright-driver-motion-canvas --all-targets 2>&1 | tee verification/motion-canvas/check.log
      - name: Validate launch-film managed source
        run: |
          rm -rf "$RUNNER_TEMP/launch-source"
          cargo run --locked -q -p semwright-driver-motion-canvas --example materialize -- demos/launch-film/semwright-motion.json "$RUNNER_TEMP/launch-source"
          python3 -m py_compile scripts/demo/generate-launch-sound.py scripts/demo/verify-launch-assets.py
          python3 scripts/demo/verify-launch-assets.py
      - name: Unit, property and security tests
        run: cargo test --locked -p semwright-driver-motion-canvas --all-targets 2>&1 | tee verification/motion-canvas/tests.log
      - name: Clippy
        run: cargo clippy --locked -p semwright-driver-motion-canvas --all-targets -- -D warnings 2>&1 | tee verification/motion-canvas/clippy.log
      - name: Formatting and whitespace
        run: |
          cargo fmt --all -- --check
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: motion-canvas-domain-evidence
          path: verification/motion-canvas
          retention-days: 14

  portable-compile:
    needs: scope
    if: ${{ needs.scope.outputs.motion == 'true' && needs.scope.outputs.native_only != 'true' }}
    concurrency:
      group: motion-portable-${{ github.event_name }}-${{ matrix.os }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motion-canvas-portable-${{ matrix.os }}
      - name: Compile portable domain and driver protocol adapter
        run: cargo check --locked -p semwright-driver-motion-canvas --lib --bin semwright-motion-canvas-driver

  real-render-and-host:
    needs: [scope, domain]
    if: ${{ always() && !cancelled() && (needs.scope.outputs.motion == 'true') }}
    concurrency:
      group: motion-native-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motion-canvas-render-host
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: integrations/motion-canvas/runtime/package-lock.json
      - name: Install Linux sandbox prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Enable Bubblewrap user namespaces with scoped AppArmor profile
        run: |
          sudo apt-get install -y apparmor-profiles apparmor-utils
          PROFILE=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$PROFILE"
          cp "$PROFILE" "$RUNNER_TEMP/bwrap-userns-restrict"
          # Ubuntu 24.04's extra profile predates the upstream mediate_deleted fix.
          # Keep userns restriction enabled; update only the scoped bwrap profile.
          python3 - "$RUNNER_TEMP/bwrap-userns-restrict" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          old = "flags=(attach_disconnected)"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"unexpected bwrap AppArmor profile shape: {count} flag matches")
          text = text.replace(old, "flags=(attach_disconnected,mediate_deleted)")
          # Specialize only this ephemeral CI profile for Semwright's exact
          # Driver Host chain.  The first bwrap exec drops into the stacked
          # unprivileged profile; all later tool execs inherit that confinement
          # instead of attempting a second transition under no_new_privs.
          parent = "allow px /** -> bwrap//&unpriv_bwrap,"
          nested = "allow pix /** -> &unpriv_bwrap,"
          parent_rules = "\n".join([
              "  allow px /plugin/sandbox -> bwrap//&unpriv_bwrap,",
              "  allow ix /plugin/bin,",
              "  allow ix /workspace/**,",
              "  allow ix /usr/**,",
              "  allow ix /tmp/**,",
          ])
          child_rules = "\n".join([
              "  allow ix /plugin/bin,",
              "  allow ix /workspace/**,",
              "  allow ix /usr/**,",
              "  allow ix /tmp/**,",
          ])
          if text.count(parent) != 1 or text.count(nested) != 1:
              raise SystemExit("unexpected bwrap AppArmor exec-rule shape")
          text = text.replace("  " + parent, parent_rules)
          text = text.replace("  " + nested, child_rules)
          path.write_text(text)
          PY
          sudo install -m 0644 "$RUNNER_TEMP/bwrap-userns-restrict" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 1)" != "0"
          # The exact chained probe below replaces a generic bwrap→/usr/bin/true smoke:
          # this profile intentionally permits only the Semwright Driver Host exec chain.
          # Model the Driver Host exec depth before installing browsers: bwrap
          # starts the staged sandbox helper, which execs the staged driver,
          # which then execs a runtime tool under the same stacked profile.
          rm -rf "$RUNNER_TEMP/aa-exec-probe"
          mkdir -p "$RUNNER_TEMP/aa-exec-probe/runtime"
          SETPRIV=$(command -v setpriv)
          test -x "$SETPRIV"
          cp "$SETPRIV" "$RUNNER_TEMP/aa-exec-probe/sandbox"
          cp /bin/sh "$RUNNER_TEMP/aa-exec-probe/driver"
          cp /usr/bin/true "$RUNNER_TEMP/aa-exec-probe/runtime/tool"
          chmod 0755 "$RUNNER_TEMP/aa-exec-probe/sandbox" "$RUNNER_TEMP/aa-exec-probe/driver" "$RUNNER_TEMP/aa-exec-probe/runtime/tool"
          probe=(bwrap --unshare-all --clearenv --proc /proc --dev /dev --tmpfs /tmp \
            --dir /home --dir /workspace --dir /plugin --dir /etc)
          for root in /usr /lib /lib64; do
            if test -e "$root"; then probe+=(--ro-bind "$root" "$root"); fi
          done
          if test -f /etc/ld.so.cache; then
            probe+=(--ro-bind /etc/ld.so.cache /etc/ld.so.cache)
          fi
          probe+=(--ro-bind "$RUNNER_TEMP/aa-exec-probe/sandbox" /plugin/sandbox)
          probe+=(--ro-bind "$RUNNER_TEMP/aa-exec-probe/driver" /plugin/bin)
          probe+=(--ro-bind "$RUNNER_TEMP/aa-exec-probe/runtime" /workspace/runtime)
          probe+=(--setenv PATH /usr/bin:/bin --setenv LANG C.UTF-8)
          "${probe[@]}" -- /plugin/sandbox --no-new-privs /plugin/bin -c '/workspace/runtime/tool && /usr/bin/true'
      - name: Install exact runtime without package scripts
        working-directory: integrations/motion-canvas/runtime
        run: npm ci --ignore-scripts
      - name: Runtime contract tests
        working-directory: integrations/motion-canvas/runtime
        run: npm test
      - name: Install pinned Firefox only on ephemeral runner
        working-directory: integrations/motion-canvas/runtime
        run: npx --no-install playwright install --with-deps firefox
      - name: Probe exact runtime
        working-directory: integrations/motion-canvas/runtime
        run: npm run probe
      - name: Materialize deterministic managed fixture
        run: |
          rm -rf "$RUNNER_TEMP/motion-generated"
          cargo run --locked -q -p semwright-driver-motion-canvas --example materialize -- fixtures/motion-canvas/hello-text/semwright-motion.json "$RUNNER_TEMP/motion-generated"
          ln -s "$GITHUB_WORKSPACE/integrations/motion-canvas/runtime/node_modules" "$RUNNER_TEMP/motion-generated/node_modules"
      - name: Typecheck and Vite-build generated Motion Canvas project
        run: |
          cd "$RUNNER_TEMP/motion-generated"
          "$GITHUB_WORKSPACE/integrations/motion-canvas/runtime/node_modules/.bin/tsc" --noEmit
          "$GITHUB_WORKSPACE/integrations/motion-canvas/runtime/node_modules/.bin/vite" build
      - name: Typecheck semantic-completeness fixture against Motion Canvas 3.17.2
        run: |
          rm -rf "$RUNNER_TEMP/motion-semantic-complete"
          cargo run --locked -q -p semwright-driver-motion-canvas --example materialize -- fixtures/motion-canvas/semantic-complete/semwright-motion.json "$RUNNER_TEMP/motion-semantic-complete"
          ln -s "$GITHUB_WORKSPACE/integrations/motion-canvas/runtime/node_modules" "$RUNNER_TEMP/motion-semantic-complete/node_modules"
          cd "$RUNNER_TEMP/motion-semantic-complete"
          "$GITHUB_WORKSPACE/integrations/motion-canvas/runtime/node_modules/.bin/tsc" --noEmit
          "$GITHUB_WORKSPACE/integrations/motion-canvas/runtime/node_modules/.bin/vite" build
      - name: Stage owner-pinned Node tool for Driver Host
        working-directory: integrations/motion-canvas/runtime
        run: |
          NODE_TOOL="$RUNNER_TEMP/semwright-motion-node"
          cp "$(command -v node)" "$NODE_TOOL"
          chmod 0700 "$NODE_TOOL"
          mapfile -t BROWSERS < <(find node_modules/playwright-core/.local-browsers -path '*/firefox-*/firefox/firefox' -type f -perm -111 -print)
          test "${#BROWSERS[@]}" -eq 1
          mkdir -p "$GITHUB_WORKSPACE/verification/motion-canvas-host"
          {
            echo "node_sha256=$(sha256sum "$NODE_TOOL" | awk '{print $1}')"
            echo "browser_sha256=$(sha256sum "${BROWSERS[0]}" | awk '{print $1}')"
            echo "embedded_helper_sha256=$(sha256sum render.mjs | awk '{print $1}')"
          } > "$GITHUB_WORKSPACE/verification/motion-canvas-host/runtime-tool-attestation.txt"
          cat "$GITHUB_WORKSPACE/verification/motion-canvas-host/runtime-tool-attestation.txt"
      - name: Real Driver Host conformance and sandboxed render/cancellation
        env:
          SEMWRIGHT_TEST_MOTION_CANVAS: '1'
          SEMWRIGHT_TEST_MOTION_CANVAS_RENDER: '1'
          SEMWRIGHT_TEST_MOTION_RUNTIME: ${{ github.workspace }}/integrations/motion-canvas/runtime
          SEMWRIGHT_TEST_MOTION_NODE: ${{ runner.temp }}/semwright-motion-node
          SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/target/debug/semwright-sandbox
          SEMWRIGHT_TEST_MOTION_EVIDENCE: ${{ github.workspace }}/verification/motion-canvas-host/artifacts
        run: |
          mkdir -p verification/motion-canvas-host
          cargo build --locked -p semwright-plugin-host --bin semwright-sandbox -p semwright-driver-motion-canvas --bin semwright-motion-canvas-driver
          cargo test --locked -p semwright-driver-motion-canvas motion_driver_runs_through_real_driver_host_without_network -- --ignored --nocapture 2>&1 | tee verification/motion-canvas-host/conformance.log
          cargo test --locked -p semwright-driver-motion-canvas real_motion_canvas_render_runs_inside_sandbox -- --ignored --nocapture 2>&1 | tee verification/motion-canvas-host/render.log
          cargo test --locked -p semwright-driver-motion-canvas composition_authoring_runs_through_broker_driver_host_and_native_renderer -- --ignored --nocapture 2>&1 | tee verification/motion-canvas-host/composition-authoring.log
      - name: Capture sandbox denial diagnostics
        if: failure()
        run: |
          mkdir -p verification/motion-canvas-host
          {
            echo '=== aa-status ==='
            sudo aa-status || true
            echo '=== loaded bwrap profile ==='
            sudo cat /etc/apparmor.d/bwrap-userns-restrict || true
            echo '=== recent kernel AppArmor/audit ==='
            sudo journalctl -k --no-pager --since '-20 min' 2>/dev/null | grep -Ei 'apparmor|audit|denied|bwrap|firefox|chrome' || true
            echo '=== dmesg tail ==='
            sudo dmesg 2>/dev/null | grep -Ei 'apparmor|audit|denied|bwrap|firefox|chrome' | tail -300 || true
          } > verification/motion-canvas-host/sandbox-denials.log 2>&1
          cat verification/motion-canvas-host/sandbox-denials.log
      - name: Verify pinned Firefox within original 4 GiB address-space ceiling
        working-directory: integrations/motion-canvas/runtime
        run: |
          mkdir -p verification
          # Mirror the production renderer's Node/browser composition. Plain Node 22
          # reserves WebAssembly trap-handler address space before probe.mjs runs and
          # can fail under RLIMIT_AS even though the production helper disables it.
          mkdir -p "$RUNNER_TEMP/motion-firefox-4g-tmp"
          set +e
          (
            ulimit -v 4194304
            export TMPDIR="$RUNNER_TEMP/motion-firefox-4g-tmp" TMP="$RUNNER_TEMP/motion-firefox-4g-tmp" TEMP="$RUNNER_TEMP/motion-firefox-4g-tmp"
            export MOZ_DISABLE_CONTENT_SANDBOX=1
            "$RUNNER_TEMP/semwright-motion-node" --disable-wasm-trap-handler --max-old-space-size=512 probe.mjs
          ) >verification/firefox-4g-address-space.log 2>&1
          rc=$?
          set -e
          echo "exit_code=$rc" >>verification/firefox-4g-address-space.log
          cat verification/firefox-4g-address-space.log
          test "$rc" -eq 0
          node --input-type=module -e "import fs from 'node:fs'; const v=JSON.parse(fs.readFileSync('evidence/versions.json','utf8')); if(v.browserFamily!=='firefox'||v.canvas!==true||v.browser_probe_error) process.exit(1)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: motion-canvas-real-render-evidence
          path: |
            integrations/motion-canvas/runtime/evidence
            integrations/motion-canvas/runtime/verification
            verification/motion-canvas-host
          retention-days: 14

  fuzz:
    needs: [scope, domain, portable-compile, real-render-and-host]
    if: ${{ always() && !cancelled() && (needs.scope.outputs.motion == 'true' && needs.scope.outputs.native_only != 'true') }}
    concurrency:
      group: motion-fuzz-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-09-18
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: motion-canvas-fuzz
          workspaces: fuzz
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo +1.98.1 install --locked cargo-fuzz --version 0.13.2
      - name: Bounded Motion Canvas fuzz smoke
        run: |
          set -o pipefail
          mkdir -p verification/motion-canvas-fuzz
          for target in motion_project motion_reference motion_animation motion_path motion_svg motion_codegen motion_semantic; do
            cargo +nightly-2026-09-18 fuzz run "$target" -- -max_total_time=5 -timeout=3 -rss_limit_mb=1024 -max_len=131072 2>&1 | tee "verification/motion-canvas-fuzz/$target.log"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: motion-canvas-fuzz-evidence
          path: |
            verification/motion-canvas-fuzz
            fuzz/artifacts
          retention-days: 14
