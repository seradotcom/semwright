name: Reviewer defensive fault evidence (auxiliary source transport)
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact source commit under independent review
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  reviewer-faults:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      AUXILIARY_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: auxiliary
          persist-credentials: false
      - name: Validate exact review input
        run: '[[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.reviewed_sha }}
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: source
          key: reviewer-fault-evidence
      - name: Record host and auxiliary provenance
        run: |
          set -euo pipefail
          mkdir evidence
          printf '%s\n' "$REVIEWED_SHA" > evidence/REVIEWED_SHA
          printf '%s\n' "$AUXILIARY_SHA" > evidence/AUXILIARY_SHA
          uname -a > evidence/host.txt
          cat /etc/os-release >> evidence/host.txt
          rustc --version --verbose > evidence/tool-versions.txt
          cargo --version >> evidence/tool-versions.txt
          python3 --version >> evidence/tool-versions.txt
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev dbus
          dbus-daemon --version >> evidence/tool-versions.txt
      - name: Overlay reviewer test harness only
        run: |
          set -euo pipefail
          python3 auxiliary/reviewer-harness/apply-reviewer-harness.py \
            --source source --reviewed-sha "$REVIEWED_SHA" --output evidence
      - name: Audit faults around a disposable side effect
        id: audit
        continue-on-error: true
        working-directory: source
        run: |
          set -euo pipefail
          cargo test --locked -p semwright-core --test reviewer_audit_faults -- --nocapture 2>&1 | tee ../evidence/audit-faults.log
      - name: Pending portal revocation on a private mock bus
        id: portal
        continue-on-error: true
        working-directory: source
        run: |
          set -euo pipefail
          cargo test --locked -p semwright-platform-linux --lib reviewer_portal_revocation_during_pending_start_cannot_report_granted -- --nocapture 2>&1 | tee ../evidence/portal-revocation.log
      - name: Retain actual outcomes and fail if either case failed
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          PORTAL_OUTCOME: ${{ steps.portal.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('evidence/OUTCOMES.json').write_text(json.dumps({
              'reviewed_sha':os.environ['REVIEWED_SHA'],
              'auxiliary_sha':os.environ['AUXILIARY_SHA'],
              'audit':os.environ['AUDIT_OUTCOME'],
              'portal':os.environ['PORTAL_OUTCOME'],
          }, indent=2)+'\n')
          assert 'running 2 tests' in Path('evidence/audit-faults.log').read_text(), 'audit harness did not execute two tests'
          assert 'running 1 test' in Path('evidence/portal-revocation.log').read_text(), 'portal harness did not execute one test'
          PY
          (cd evidence && sha256sum *.json *.log *.txt AUXILIARY_SHA REVIEWED_SHA > SHA256SUMS)
          test "$AUDIT_OUTCOME" = success
          test "$PORTAL_OUTCOME" = success
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reviewer-fault-evidence-${{ inputs.reviewed_sha }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
