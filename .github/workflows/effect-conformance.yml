name: Effect conformance diagnostics
on:
  push:
    branches: [feat/effect-conformance]
    paths:
      - 'crates/effect-conformance/**'
      - 'scripts/effects/**'
      - '.github/workflows/effect-conformance.yml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'crates/effect-conformance/**'
      - 'scripts/effects/**'
      - '.github/workflows/effect-conformance.yml'
permissions:
  contents: read
concurrency:
  group: effect-conformance-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: never
jobs:
  effect-contract:
    if: github.event_name != 'pull_request' || github.head_ref != 'feat/effect-conformance'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: effects-v1-ubuntu-x64-rust1.98.1
      - name: Exact source and executed-test receipts
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/effects/run_suite.py effect-contract
      - name: Clippy and rustdoc
        run: |
          cargo clippy --locked -p semwright-effect-conformance --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked -p semwright-effect-conformance --no-deps
      - name: Format gate and small remediation patch
        run: |
          cargo fmt -p semwright-effect-conformance
          git diff -- crates/effect-conformance > verification/effects/format.patch
          if test -s verification/effects/format.patch; then
            git apply -R verification/effects/format.patch
            echo 'Source formatting requires the attached patch.'
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: effect-contract-${{ github.event.pull_request.head.sha || github.sha }}
          path: verification/effects
          retention-days: 7
          if-no-files-found: error
