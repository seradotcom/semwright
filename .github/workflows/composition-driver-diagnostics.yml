name: Composition driver diagnostics
on:
  push:
    branches: [feat/composition-media]
    paths:
      - 'crates/driver-motion-canvas/**'
      - 'crates/driver-figma/**'
      - 'crates/semantic-composition/**'
      - 'crates/media-time/**'
      - 'crates/motion-authoring/**'
      - 'integrations/composition/**'
      - 'integrations/motion-canvas/**'
      - 'fixtures/composition/**'
      - 'scripts/composition/ci-scope.py'
      - '.github/workflows/composition-driver-diagnostics.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_dispatch:
    inputs:
      certify_all:
        description: 'Run both production adapters for exact candidate certification'
        required: false
        type: boolean
        default: false
      candidate_sha:
        description: 'Exact candidate SHA; required when certify_all=true'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: composition-driver-diagnostics-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      motion: ${{ steps.scope.outputs.motion }}
      figma: ${{ steps.scope.outputs.figma }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: scope
        env:
          CERTIFY_ALL: ${{ inputs.certify_all }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          mode=iteration
          if [ "$CERTIFY_ALL" = true ]; then mode=certify; fi
          args=(--mode "$mode" --after "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT")
          if [ "$mode" = certify ]; then args+=(--candidate-sha "$CANDIDATE_SHA"); fi
          python scripts/composition/ci-scope.py "${args[@]}"
  motion-rust:
    needs: scope
    if: ${{ needs.scope.outputs.motion == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: composition-motion-driver-v2
      - name: Compile Motion production adapter and tests
        run: cargo check --locked -p semwright-driver-motion-canvas --all-targets
      - name: Motion driver unit regression
        run: cargo test --locked -p semwright-driver-motion-canvas --lib
      - name: Motion lints
        run: cargo clippy --locked -p semwright-driver-motion-canvas --all-targets -- -D warnings
  figma-rust:
    needs: scope
    if: ${{ needs.scope.outputs.figma == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: composition-figma-driver-v2
      - name: Compile Figma production adapter and tests
        run: cargo check --locked -p semwright-driver-figma --all-targets
      - name: Figma shared-kernel regression
        run: cargo test --locked -p semwright-driver-figma --lib --bin semwright-figma-driver
      - name: Figma lints
        run: cargo clippy --locked -p semwright-driver-figma --all-targets -- -D warnings
  native-typecheck:
    needs: scope
    if: ${{ needs.scope.outputs.motion == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: integrations/motion-canvas/runtime/package-lock.json
      - name: Pinned Motion Canvas dependencies
        working-directory: integrations/motion-canvas/runtime
        run: npm ci --ignore-scripts
      - name: Check native runtime against upstream types
        working-directory: integrations/motion-canvas/runtime
        run: |
          cp ../../composition/motion/native.ts native-authoring-check.ts
          ./node_modules/.bin/tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler --strict --skipLibCheck --allowSyntheticDefaultImports native-authoring-check.ts
      - name: Renderer syntax
        run: node --check integrations/motion-canvas/runtime/render.mjs
  adapter-gate:
    if: always()
    needs: [scope, motion-rust, figma-rust, native-typecheck]
    runs-on: windows-2022
    timeout-minutes: 2
    steps:
      - name: Requested adapter lanes must complete
        env:
          MOTION_REQUIRED: ${{ needs.scope.outputs.motion }}
          FIGMA_REQUIRED: ${{ needs.scope.outputs.figma }}
          MOTION: ${{ needs.motion-rust.result }}
          FIGMA: ${{ needs.figma-rust.result }}
          TYPESCRIPT: ${{ needs.native-typecheck.result }}
        run: |
          check() { required="$1"; result="$2"; [ "$required" != true ] || [ "$result" = success ]; }
          check "$MOTION_REQUIRED" "$MOTION"
          check "$MOTION_REQUIRED" "$TYPESCRIPT"
          check "$FIGMA_REQUIRED" "$FIGMA"
