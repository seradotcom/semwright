name: Composition diagnostics
on:
  push:
    branches: [feat/composition-media]
    paths:
      - 'crates/semantic-composition/**'
      - 'crates/media-time/**'
      - 'crates/motion-authoring/**'
      - 'crates/av-composition/**'
      - 'crates/core/src/lib.rs'
      - 'crates/core/src/workflows.rs'
      - 'crates/core/tests/provider_runtime.rs'
      - 'crates/recipes/**'
      - 'crates/skills/src/tests.rs'
      - 'skills/semwright-figma-production/**'
      - 'skills/semwright-video-production/**'
      - 'skills/semwright-av-production/**'
      - 'fixtures/composition/**'
      - 'benchmarks/composition/**'
      - 'packaging/composition-development/**'
      - 'scripts/composition/**'
      - '.github/workflows/composition-diagnostics.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_dispatch:
    inputs:
      certify_all:
        description: 'Run full Composition certification for the checked-out candidate'
        required: false
        type: boolean
        default: false
      candidate_sha:
        description: 'Exact candidate SHA; required when certify_all=true'
        required: false
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      contracts: ${{ steps.scope.outputs.contracts }}
      broker: ${{ steps.scope.outputs.broker }}
      package: ${{ steps.scope.outputs.package }}
      skills: ${{ steps.scope.outputs.skills }}
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: scope
        env:
          CERTIFY_ALL: ${{ inputs.certify_all }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          mode=iteration
          if [ "$CERTIFY_ALL" = true ]; then mode=certify; fi
          args=(--mode "$mode" --after "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT")
          if [ "$mode" = certify ]; then args+=(--candidate-sha "$CANDIDATE_SHA"); fi
          python scripts/composition/ci-scope.py "${args[@]}"
  contracts:
    needs: scope
    if: ${{ needs.scope.outputs.contracts == 'true' }}
    concurrency:
      group: composition-contracts-${{ github.event_name }}-${{ matrix.os }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: composition-contracts-v2
          save-if: ${{ github.event_name == 'push' }}
      - name: Format
        run: cargo fmt -p semwright-semantic-composition -p semwright-media-time -p semwright-motion-authoring -p semwright-av-composition -- --check
      - name: Typed contracts and exact media time
        run: python scripts/composition/run-suite.py contracts
      - name: Motion authoring models and grammar
        run: python scripts/composition/run-suite.py motion
      - name: AV coordination and final-media sync contracts
        run: python scripts/composition/run-suite.py av
      - name: Benchmark harness invariants
        run: python benchmarks/composition/test_run.py
      - name: Lints
        run: cargo clippy --locked -p semwright-semantic-composition -p semwright-media-time -p semwright-motion-authoring -p semwright-av-composition --all-targets --no-deps -- -D warnings
      - name: Generated contract schemas
        run: cargo run --locked -p semwright-semantic-composition --example schemas > verification/composition/schemas.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: composition-contracts-${{ matrix.os }}-${{ github.sha }}
          path: verification/composition
          retention-days: 7
          if-no-files-found: error
  broker-session:
    needs: [scope, contracts]
    if: ${{ always() && !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.broker == 'true' }}
    concurrency:
      group: composition-broker-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install Core native build prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: composition-broker-session-v2
      - name: Session executor keeps Broker policy authority
        run: cargo test --locked -p semwright-core --test provider_runtime session_executor_preserves_broker_policy_before_provider_execution -- --exact --nocapture
      - name: Core bridge lint
        run: cargo clippy --locked -p semwright-core --lib -- -D warnings
  development-package:
    needs: scope
    if: ${{ needs.scope.outputs.package == 'true' }}
    concurrency:
      group: composition-package-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Development package and candidate evidence unit tests
        run: |
          python scripts/composition/test-package-dev.py
          python scripts/composition/test-candidate-evidence.py
          python scripts/composition/test-ci-scope.py
          python scripts/composition/test-run-suite.py
      - name: Build and verify Agent-A source handoff
        run: |
          mkdir -p verification/composition-package
          python scripts/composition/package-dev.py build --output verification/composition-package/semwright-composition-development.zip
          python scripts/composition/package-dev.py verify verification/composition-package/semwright-composition-development.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: composition-development-${{ github.sha }}
          path: verification/composition-package
          retention-days: 7
          if-no-files-found: error
  skill-packages:
    needs: [scope, broker-session]
    if: ${{ always() && !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.skills == 'true' }}
    concurrency:
      group: composition-skills-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: composition-skills-v2
      - name: First-party Composition Skills validate
        run: cargo test --locked -p semwright-skills official_skills_validate_and_keep_progressive_disclosure_small -- --exact --nocapture
      - name: AV Skill stays blocked without public audio Composition
        run: cargo test --locked -p semwright-skills av_skill_stays_blocked_until_public_audio_composition_is_advertised -- --exact --nocapture
  contracts-gate:
    if: always()
    needs: [scope, contracts, broker-session, development-package, skill-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Requested iteration areas or full certification must succeed
        env:
          CONTRACTS_REQUIRED: ${{ needs.scope.outputs.contracts }}
          BROKER_REQUIRED: ${{ needs.scope.outputs.broker }}
          PACKAGE_REQUIRED: ${{ needs.scope.outputs.package }}
          SKILLS_REQUIRED: ${{ needs.scope.outputs.skills }}
          CONTRACTS: ${{ needs.contracts.result }}
          BROKER: ${{ needs.broker-session.result }}
          PACKAGE: ${{ needs.development-package.result }}
          SKILLS: ${{ needs.skill-packages.result }}
        run: |
          check() { required="$1"; result="$2"; [ "$required" != true ] || [ "$result" = success ]; }
          check "$CONTRACTS_REQUIRED" "$CONTRACTS"
          check "$BROKER_REQUIRED" "$BROKER"
          check "$PACKAGE_REQUIRED" "$PACKAGE"
          check "$SKILLS_REQUIRED" "$SKILLS"
