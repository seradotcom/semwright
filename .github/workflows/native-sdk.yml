name: Native SDK canonical
on:
  push:
    branches: [feat/native-sdk-canonical]
    paths:
      - 'docs/native-sdk/**'
      - 'scripts/native-sdk/**'
      - '.github/workflows/native-sdk.yml'
      - '.circleci/config.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact immutable HEAD
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-sdk-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact-SHA metadata validation
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: python3 scripts/native-sdk/run-suite.py audit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-sdk-audit-${{ github.sha }}
          path: verification/native-sdk
          if-no-files-found: error
          retention-days: 7
