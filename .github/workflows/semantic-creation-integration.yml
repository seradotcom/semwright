name: Semantic creation review delivery (I)
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Immutable product source for the development review package
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: semantic-creation-review-packet-${{ github.sha }}
  cancel-in-progress: false
jobs:
  review-packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate fixed product source
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
        run: test "$CANDIDATE" = cd518748f742025a251b78028613aa1b16919e73
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: packet
          persist-credentials: false
      - name: Package source, patch and evidence without runtimes or caches
        env:
          PRODUCT_CHECKOUT: ${{ github.workspace }}/product
          PACKET_OUTPUT: ${{ runner.temp }}/i-review-packet
        run: python3 packet/integration-review/package_on_runner.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semantic-creation-I-cd51874-review-delivery
          path: ${{ runner.temp }}/i-review-packet
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semantic-creation-I-cd51874-review-summary
          path: |
            ${{ runner.temp }}/i-review-packet/manifest.json
            ${{ runner.temp }}/i-review-packet/INTEGRATED_ACCEPTANCE.json
            ${{ runner.temp }}/i-review-packet/delivery-summary.json
            ${{ runner.temp }}/i-review-packet/*.sha256
          if-no-files-found: error
          retention-days: 14
