name: I Linux Host control regressions
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  host-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: cd518748f742025a251b78028613aa1b16919e73
      - name: Bind exact product source
        run: |
          test "$(git rev-parse HEAD)" = "cd518748f742025a251b78028613aa1b16919e73"
          mkdir -p verification/host-controls
          git rev-parse HEAD > verification/host-controls/product-source-sha.txt
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: godot-authoring-v1
      - name: Isolated Host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils libpipewire-0.3-dev
          bash scripts/dev/ci-driver-bwrap-profile.sh verification/host-controls/sandbox-setup.log
      - name: Host formatting and strict lints
        run: |
          cargo fmt -p semwright-driver-host -- --check
          cargo clippy --locked -p semwright-driver-host --features test-tools --all-targets --no-deps -- -D warnings
      - name: Host and SDK source contracts
        run: |
          set -euo pipefail
          cargo test --locked -p semwright-driver-host --lib 2>&1 | tee verification/host-controls/host-unit.log
          cargo test --locked -p semwright-driver-sdk --lib 2>&1 | tee verification/host-controls/sdk-unit.log
      - name: Build owned sandbox helper
        run: cargo build --locked -p semwright-plugin-host --bin semwright-sandbox
      - name: Native Linux v5-v8 Host controls
        env:
          SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/target/debug/semwright-sandbox
        run: |
          set -euo pipefail
          cargo test --locked -p semwright-driver-host --features test-tools --test runtime_tools_linux \
            -- --ignored --nocapture 2>&1 | tee verification/host-controls/native-host-controls.log
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored;' verification/host-controls/native-host-controls.log
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: host-controls
          path: verification/host-controls/
          if-no-files-found: error
          retention-days: 14
  godot-export:
    needs: host-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: cd518748f742025a251b78028613aa1b16919e73
      - name: Exact source checkout
        run: test "$(git rev-parse HEAD)" = "cd518748f742025a251b78028613aa1b16919e73"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: godot-authoring-export-v1
      - name: Install isolated native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils libpipewire-0.3-dev
          mkdir -p verification/godot-export
          bash scripts/dev/ci-driver-bwrap-profile.sh verification/godot-export/sandbox-setup.log
      - name: Install pinned Godot 4.7.2 and Linux release template
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/export-templates"
          curl -fL --retry 4 --retry-delay 2 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e  $GODOT" | sha256sum -c -
          "$GODOT" --version | tee verification/godot-export/godot-version.txt
          curl -fL --retry 4 --retry-delay 2 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/export-templates.tpz"
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $RUNNER_TEMP/export-templates.tpz" | sha256sum -c -
          unzip -j -q "$RUNNER_TEMP/export-templates.tpz" \
            "templates/linux_release.x86_64" -d "$RUNNER_TEMP/export-templates"
          rm "$RUNNER_TEMP/export-templates.tpz"
          chmod 0755 "$RUNNER_TEMP/export-templates/linux_release.x86_64"
          echo "GODOT_BIN=$GODOT" >> "$GITHUB_ENV"
          echo "SEMWRIGHT_TEST_GODOT_EXPORT_TEMPLATES=$RUNNER_TEMP/export-templates" >> "$GITHUB_ENV"
      - name: Build sandbox helper
        run: cargo build --locked -p semwright-plugin-host --bin semwright-sandbox
      - name: Broker standalone export and launch
        env:
          SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/target/debug/semwright-sandbox
        run: |
          set -euo pipefail
          git rev-parse HEAD > verification/godot-export/product-source-sha.txt
          for control_iteration in 1 2; do
            cargo test --locked -p semwright-driver-godot --test authoring_host \
              export_lane_builds_and_launches_without_editor_or_semwright \
              -- --ignored --exact --nocapture \
              2>&1 | tee "verification/godot-export/export-host-$control_iteration.log"
          done
      - name: Export evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: godot-export
          path: verification/godot-export/
          if-no-files-found: error
          retention-days: 14

