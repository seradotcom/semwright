name: Selected provider release pair-gate regression
on:
  push:
    branches: ['verify/a6-pairgate-6f-onecase-20261107']
    paths: ['.github/workflows/core-provider-pair-gate-selected.yml']
permissions:
  contents: read
concurrency:
  group: pair-gate-source-once
  cancel-in-progress: false
jobs:
  selected-core:
    name: One compiled core pair-gate test; no Native acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.98.1'
      - name: Check source provenance and exact intended scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'seradotcom/semwright'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_REF" = 'refs/heads/verify/a6-pairgate-6f-onecase-20261107'
          test "$(git rev-parse HEAD~2)" = '6f053e257a94b1969fc9e42b675a8b6992500e28'
          test "$(git diff --name-only HEAD~2 HEAD)" = '.github/workflows/core-provider-pair-gate-selected.yml'
          {
            printf '%s  %s\n' 'ec7f3946d36a3e9e0a6054173220553bd652904cfa48a17daec66ce2e549a18c' 'Cargo.lock'
            printf '%s  %s\n' '842734f50d99a45e8f4fcbe026d4b52a771cc5d2bdc4c62b499dff162819f03f' 'crates/core/src/provider_mounts_tests.rs'
            printf '%s  %s\n' 'b0d714b7d4271df432f0da76517c8f24acbae500da767213abd5db9f403c8d23' 'crates/core/src/operation_permits.rs'
          } | sha256sum --check --status
          test -z "$(git status --porcelain=v1)"
      - name: Compile and run one selected original core test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/provider-pair-single"
          case_id='provider_mounts::tests::pair_contract_controls::pair_gate_closing_preserves_known_completion_but_refuses_new_admission'
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/provider-pair-single/source-sha.original"
          printf '%s\n' "$case_id" > "$RUNNER_TEMP/provider-pair-single/selected-case.original"
          cargo test --locked --package semwright-core --lib "$case_id" -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/provider-pair-single/one-test.original.log"
          grep -F "test $case_id ... ok" "$RUNNER_TEMP/provider-pair-single/one-test.original.log"
          grep -E '^test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/provider-pair-single/one-test.original.log"
          sha256sum "$RUNNER_TEMP/provider-pair-single/one-test.original.log" > "$RUNNER_TEMP/provider-pair-single/one-test.sha256"
      - name: Retain original selected test log on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: provider-pair-single
          path: ${{ runner.temp }}/provider-pair-single/
          retention-days: 5
          if-no-files-found: warn
