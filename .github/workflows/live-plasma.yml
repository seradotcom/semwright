name: Plasma Wayland live
defaults:
  run:
    shell: bash
on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'crates/platform-linux/**'
      - 'crates/platform-linux-sys/**'
      - 'crates/platform-api/**'
      - 'crates/platform-services/**'
      - '.github/workflows/live-plasma.yml'
  pull_request:
    paths:
      - 'crates/platform-linux/**'
      - 'crates/platform-linux-sys/**'
      - 'crates/platform-api/**'
      - 'crates/platform-services/**'
      - '.github/workflows/live-plasma.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plasma-live-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # KDE neon User, immutable amd64 image verified in the upstream registry.
  KDE_NEON_IMAGE: invent-registry.kde.org/neon/docker-images/plasma@sha256:ab8faaef342303c21c40d44e9a94d03efa7cfb25cccf251c896a0cd0a9a65808

jobs:
  plasma-wayland:
    if: ${{ !(vars.SEMWRIGHT_PAUSE_MAIN_CI == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) }}
    # Pin a supported runner label; udmabuf availability is checked explicitly.
    # This also keeps strict actionlint 1.7.12 validation without an exemption.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: plasma-wayland-live

      - name: Verify the virtual KWin software-buffer device
        run: |
          # Fail early, before downloading the multi-GB KDE image. This is a
          # software DMA-BUF device, not a physical GPU or unrestricted /dev.
          mkdir -p verification/live-plasma-ci
          if ! test -c /dev/udmabuf; then
            sudo modprobe udmabuf
          fi
          test -c /dev/udmabuf
          stat -c 'device=%n mode=%a uid=%u gid=%g' /dev/udmabuf \
            | tee verification/live-plasma-ci/udmabuf-device.log

      - name: Build the production KWin backend integration test
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev xvfb xauth
          mkdir -p verification/live-plasma-ci
          cargo test --locked -p semwright-platform-linux --test kwin_live             --no-run --message-format=json             > verification/live-plasma-ci/rust-build.jsonl
          test_bin=$(python3 - <<'PY'
          import json
          from pathlib import Path
          rows = Path("verification/live-plasma-ci/rust-build.jsonl").read_text().splitlines()
          matches = []
          for line in rows:
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              target = row.get("target", {})
              if (
                  row.get("reason") == "compiler-artifact"
                  and target.get("name") == "kwin_live"
                  and "test" in target.get("kind", [])
                  and row.get("executable")
              ):
                  matches.append(row["executable"])
          if len(matches) != 1:
              raise SystemExit(f"expected one kwin_live test executable, got {matches!r}")
          print(matches[0])
          PY
          )
          cp "$test_bin" verification/live-plasma-ci/kwin-live-test
          chmod 0755 verification/live-plasma-ci/kwin-live-test
          ldd verification/live-plasma-ci/kwin-live-test             | tee verification/live-plasma-ci/kwin-live-test-ldd.log

      - name: Pull pinned KDE neon Plasma 6 image
        run: |
          docker pull "$KDE_NEON_IMAGE"
          docker image inspect "$KDE_NEON_IMAGE"             --format '{{json .RepoDigests}}'             | tee verification/live-plasma-ci/container-image.log
          grep -q 'sha256:ab8faaef342303c21c40d44e9a94d03efa7cfb25cccf251c896a0cd0a9a65808'             verification/live-plasma-ci/container-image.log

      - name: Real KWin 6 nested Wayland bridge lifecycle
        run: |
          set -euo pipefail
          # KWin's nested X11 output uses a private software-only framebuffer.
          # The actual tested windows are Wayland clients of KWin, not Xvfb.
          test ! -e /tmp/.X11-unix/X99
          umask 077
          auth_file="$RUNNER_TEMP/semwright-kwin-xvfb.auth"
          touch "$auth_file"
          cookie=$(od -v -N16 -An -tx1 /dev/urandom | tr -d ' \n')
          xauth -f "$auth_file" add :99 . "$cookie"
          # Xauthority's local hostname differs inside Docker. Share the same
          # private cookie using the X11 wild family, not an unauthenticated -ac.
          xauth -f "$auth_file" nlist :99 | sed 's/^..../ffff/' | xauth -f "$auth_file" nmerge -
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp -auth "$auth_file" \
            > verification/live-plasma-ci/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true; wait "$xvfb_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            test -S /tmp/.X11-unix/X99 && break
            kill -0 "$xvfb_pid" || { cat verification/live-plasma-ci/xvfb.log; exit 1; }
            sleep 0.1
          done
          test -S /tmp/.X11-unix/X99
          docker run --rm --init --network none \
            --security-opt seccomp=unconfined --cap-add SYS_NICE \
            --device /dev/udmabuf:/dev/udmabuf \
            --group-add "$(stat -c '%g' /dev/udmabuf)" \
            --user "$(id -u):$(id -g)" \
            --entrypoint /usr/bin/dbus-run-session \
            -e DISPLAY=:99 -e XAUTHORITY=/tmp/semwright-kwin-xvfb.auth \
            -e SEMWRIGHT_KWIN_TEST_BIN=/test/kwin-live \
            -e SEMWRIGHT_KWIN_EVIDENCE_DIR=/evidence \
            -v /tmp/.X11-unix:/tmp/.X11-unix:ro \
            -v "$auth_file:/tmp/semwright-kwin-xvfb.auth:ro" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/verification/live-plasma-ci:/evidence" \
            -v "$GITHUB_WORKSPACE/verification/live-plasma-ci/kwin-live-test:/test/kwin-live:ro" \
            "$KDE_NEON_IMAGE" -- /usr/bin/bash /workspace/scripts/dev/kwin-live-ci.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: live-plasma-wayland-evidence
          path: verification/live-plasma-ci
          retention-days: 14
